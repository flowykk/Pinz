version: '3.8'

# ──────────────────────────────────────────────────────────────────────────────
# Infrastructure
# ──────────────────────────────────────────────────────────────────────────────
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: pinz-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\\|yellow\"'"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:v1.9.1
    container_name: pinz-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

# ──────────────────────────────────────────────────────────────────────────────
# ML microservices
# ──────────────────────────────────────────────────────────────────────────────
  moderation-service:
    build: ./services/moderation_service
    container_name: pinz-moderation-service
    ports:
      - "8001:8001"
    environment:
      TEXT_MODEL_NAME: cointegrated/rubert-tiny-toxicity
      TEXT_TOXICITY_THRESHOLD: "0.5"
      IMAGE_NSFW_THRESHOLD: "0.6"
      DEVICE: cpu
      MODEL_CACHE_DIR: /model_cache
    volumes:
      - model_cache:/model_cache
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  embedding-service:
    build: ./services/embedding_service
    container_name: pinz-embedding-service
    ports:
      - "8002:8002"
    environment:
      TEXT_EMBED_MODEL: intfloat/multilingual-e5-large
      IMAGE_EMBED_MODEL: ViT-L-14
      IMAGE_EMBED_PRETRAINED: openai
      DEVICE: cpu
      MODEL_CACHE_DIR: /model_cache
    volumes:
      - model_cache:/model_cache
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8002/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  search-service:
    build: ./services/search_service
    container_name: pinz-search-service
    ports:
      - "8003:8003"
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_SERVICE_URL: http://embedding-service:8002
    depends_on:
      elasticsearch:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      embedding-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8003/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  trip-classifier-service:
    build: ./services/trip_classifier_service
    container_name: pinz-trip-classifier-service
    ports:
      - "8006:8006"
    environment:
      TRIP_ZS_MODEL: facebook/bart-large-mnli
      MODEL_CACHE_DIR: /model_cache
    volumes:
      - model_cache:/model_cache
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8006/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  pin-classifier-service:
    build: ./services/pin_classifier_service
    container_name: pinz-pin-classifier-service
    ports:
      - "8005:8005"
    environment:
      MODEL_WEIGHTS_PATH: /weights/pin_efficientnet_b4.pt
      NUM_CLASSES: "50"
      DEVICE: cpu
    volumes:
      - model_weights:/weights
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8005/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  # vLLM service requires a GPU node — disabled by default for CPU-only environments.
  # To enable: uncomment and set NVIDIA_VISIBLE_DEVICES or use `docker compose --profile gpu up`
  # vllm-service:
  #   build: ./services/vllm_service
  #   container_name: pinz-vllm-service
  #   ports:
  #     - "8004:8004"
  #   environment:
  #     MODEL_NAME: meta-llama/Meta-Llama-Guard-2-8B
  #     TENSOR_PARALLEL_SIZE: "1"
  #     GPU_MEMORY_UTILIZATION: "0.90"
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]

volumes:
  es_data:
  qdrant_data:
  model_cache:
  model_weights:
