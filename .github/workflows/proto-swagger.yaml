name: Proto & Swagger Check

on:
  pull_request:
    paths:
      - 'Backend/proto/**'
      - 'Backend/api-gateway-service/**'
      - '.github/workflows/proto-swagger.yaml'
  push:
    branches: [main, develop, 'PINZ-*']
    paths:
      - 'Backend/proto/**'
      - 'Backend/api-gateway-service/**'
      - '.github/workflows/proto-swagger.yaml'

jobs:
  proto-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - name: Generate proto files
        run: make proto
        working-directory: Backend

      - name: Check for changes in generated proto files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Proto files are not up to date. Please run 'make proto' and commit the changes."
            git status --porcelain
            exit 1
          else
            echo "Proto files are up to date ✓"
          fi

  swagger-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install swag
        run: go install github.com/swaggo/swag/cmd/swag@latest

      - name: Generate swagger docs
        run: make swagger
        working-directory: Backend

      - name: Check for changes in swagger files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Swagger files are not up to date. Please run 'make swagger' and commit the changes."
            git status --porcelain
            exit 1
          else
            echo "Swagger files are up to date ✓"
          fi