name: CI

on:
  push:
    branches: [main, develop, 'PINZ-*']
    paths:
      - 'Backend/**'
      - 'proto/**'
      - '.github/workflows/ci.yaml'
  pull_request:
    branches: [main, develop, 'PINZ-*']
    paths:
      - 'Backend/**'
      - 'proto/**'
      - '.github/workflows/ci.yaml'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install golangci-lint (built with Go 1.25)
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Lint api-gateway-service
        run: golangci-lint run --path-prefix=Backend/api-gateway-service
        working-directory: Backend/api-gateway-service

      - name: Lint auth-service
        run: golangci-lint run --path-prefix=Backend/auth-service
        working-directory: Backend/auth-service

      - name: Lint trip-service
        run: golangci-lint run --path-prefix=Backend/trip-service
        working-directory: Backend/trip-service

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway-service, auth-service, trip-service]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run tests
        run: go test -short ./...
        working-directory: Backend/${{ matrix.service }}
        env:
          JWT_SECRET_KEY: test-secret

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build api-gateway-service
        run: docker build -t api-gateway-service:v${{ github.sha }} -f Backend/api-gateway-service/Dockerfile Backend

      - name: Build auth-service
        run: docker build -t auth-service:v${{ github.sha }} -f Backend/auth-service/Dockerfile Backend

      - name: Build trip-service
        run: docker build -t trip-service:v${{ github.sha }} -f Backend/trip-service/Dockerfile Backend
