name: CI

on:
  push:
    branches: [main, develop, 'PINZ-*']
    paths:
      - 'Backend/**'
      - 'proto/**'
      - '.github/workflows/ci.yaml'
  pull_request:
    branches: [main, develop, 'PINZ-*']
    paths:
      - 'Backend/**'
      - 'proto/**'
      - '.github/workflows/ci.yaml'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install golangci-lint (built with Go 1.25)
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Lint api-gateway-service
        run: golangci-lint run --path-prefix=Backend/api-gateway-service
        working-directory: Backend/api-gateway-service

      - name: Lint auth-service
        run: golangci-lint run --path-prefix=Backend/auth-service
        working-directory: Backend/auth-service

      - name: Lint trip-service
        run: golangci-lint run --path-prefix=Backend/trip-service
        working-directory: Backend/trip-service

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway-service, auth-service, trip-service]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run tests
        run: go test -short ./...
        working-directory: Backend/${{ matrix.service }}
        env:
          JWT_SECRET_KEY: test-secret

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build api-gateway-service
        run: docker build -t api-gateway-service:v${{ github.sha }} -f Backend/api-gateway-service/Dockerfile Backend

      - name: Build auth-service
        run: docker build -t auth-service:v${{ github.sha }} -f Backend/auth-service/Dockerfile Backend

      - name: Build trip-service
        run: docker build -t trip-service:v${{ github.sha }} -f Backend/trip-service/Dockerfile Backend

  # Telegram при падении CI только для push в main, develop
  notify:
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: always() && github.event_name == 'push' && (needs.lint.result == 'failure' || needs.test.result == 'failure' || needs.build.result == 'failure') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/PINZ-112')
    steps:
      - name: Optional Telegram notification on CI failure
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID not set — skipping chat notification (badge/GitHub still show failure)."
            exit 0
          fi
          MSG="CI failed: ${{ github.repository }} @ ${{ github.ref_name }} ${{ github.sha }} — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          RESP=$(mktemp)
          HTTP_CODE=$(curl -sS -o "$RESP" -w "%{http_code}" -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" || true)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Telegram send failed (HTTP ${HTTP_CODE})."
            echo "Response:"
            cat "$RESP"
            echo "Hint: open chat with bot and press Start, then verify TELEGRAM_CHAT_ID and bot token."
            exit 0
          fi
          echo "Telegram notification sent."
