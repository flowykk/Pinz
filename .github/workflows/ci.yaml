name: CI

on:
  push:
    branches: [main, develop, 'PINZ-*']
    paths:
      - 'Backend/**'
      - 'proto/**'
      - '.github/workflows/ci.yaml'
  pull_request:
    branches: [main, develop, 'PINZ-*']
    paths:
      - 'Backend/**'
      - 'proto/**'
      - '.github/workflows/ci.yaml'

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway-service, auth-service]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: Backend/${{ matrix.service }}

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway-service, auth-service]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('Backend/**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run tests
        run: go test ./...
        working-directory: Backend/${{ matrix.service }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build api-gateway-service
        uses: docker/build-push-action@v6
        with:
          context: Backend/api-gateway-service
          file: Backend/api-gateway-service/Dockerfile
          push: false
          load: true
          tags: pinz-api-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build auth-service
        uses: docker/build-push-action@v6
        with:
          context: Backend/auth-service
          file: Backend/auth-service/Dockerfile
          push: false
          load: true
          tags: pinz-auth-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
