name: CD

on:
  push:
    branches: [main, develop, PINZ-146]
    paths:
      - 'Backend/**'
      - 'proto/**'
      - 'helm/**'
      - 'helmfile.yaml.gotmpl'
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      api-gateway: ${{ steps.filter.outputs.api-gateway }}
      auth-service: ${{ steps.filter.outputs.auth-service }}
      trip-service: ${{ steps.filter.outputs.trip-service }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changed services
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api-gateway:
              - 'Backend/api-gateway-service/**'
              - 'Backend/pkg/**'
              - 'Backend/proto/**'
              - 'helm/api-gateway/**'
              - 'helmfile.yaml.gotmpl'
            auth-service:
              - 'Backend/auth-service/**'
              - 'Backend/pkg/**'
              - 'Backend/proto/**'
              - 'helm/auth-service/**'
              - 'helmfile.yaml.gotmpl'
            trip-service:
              - 'Backend/trip-service/**'
              - 'Backend/pkg/**'
              - 'Backend/proto/**'
              - 'helm/trip-service/**'
              - 'helmfile.yaml.gotmpl'

  build-and-push:
    runs-on: ubuntu-latest
    needs: detect-changes
    outputs:
      image-tag: ${{ steps.set-image-tag.outputs.image-tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: set-image-tag
        run: |
          echo "image-tag=sha-${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push api-gateway-service
        if: needs.detect-changes.outputs.api-gateway == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v5
        with:
          context: Backend
          file: Backend/api-gateway-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_REPO }}/pinz-api-gateway:latest
            ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_REPO }}/pinz-api-gateway:${{ steps.set-image-tag.outputs.image-tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push auth-service
        if: needs.detect-changes.outputs.auth-service == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v5
        with:
          context: Backend
          file: Backend/auth-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_REPO }}/pinz-auth-service:latest
            ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_REPO }}/pinz-auth-service:${{ steps.set-image-tag.outputs.image-tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push trip-service
        if: needs.detect-changes.outputs.trip-service == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v5
        with:
          context: Backend
          file: Backend/trip-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_REPO }}/pinz-trip-service:latest
            ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_REPO }}/pinz-trip-service:${{ steps.set-image-tag.outputs.image-tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [detect-changes, build-and-push]
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set per-service image tags and deploy list
        id: tags
        run: |
          TAG="${{ needs.build-and-push.outputs.image-tag }}"
          DISPATCH="${{ github.event_name == 'workflow_dispatch' }}"
          SERVICES=""

          if [[ "${{ needs.detect-changes.outputs.api-gateway }}" == "true" ]] || [[ "$DISPATCH" == "true" ]]; then
            echo "api-gateway=$TAG" >> $GITHUB_OUTPUT
            SERVICES="${SERVICES:+$SERVICES,}api-gateway"
          fi

          if [[ "${{ needs.detect-changes.outputs.auth-service }}" == "true" ]] || [[ "$DISPATCH" == "true" ]]; then
            echo "auth-service=$TAG" >> $GITHUB_OUTPUT
            SERVICES="${SERVICES:+$SERVICES,}auth-service"
          fi

          if [[ "${{ needs.detect-changes.outputs.trip-service }}" == "true" ]] || [[ "$DISPATCH" == "true" ]]; then
            echo "trip-service=$TAG" >> $GITHUB_OUTPUT
            SERVICES="${SERVICES:+$SERVICES,}trip-service"
          fi

          # "none" tells deploy.sh to skip helmfile apply (infra-only deploy)
          echo "services=${SERVICES:-none}" >> $GITHUB_OUTPUT

      - name: Deploy to VPS
        run: |
          echo "${{ secrets.VPS_SSH_KEY }}" > /tmp/ssh_key
          chmod 600 /tmp/ssh_key

          # Test SSH connection first
          echo "Testing SSH connection..."
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=60 -o ServerAliveCountMax=3 -i /tmp/ssh_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo 'SSH connection successful'"

          # Copy updated files to server
          echo "Copying updated files to server..."
          scp -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=60 -o ServerAliveCountMax=3 -i /tmp/ssh_key -r Backend/* ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/pinz/Backend/

          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=60 -o ServerAliveCountMax=3 -i /tmp/ssh_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            cd /opt/pinz/Backend &&
            export DEPLOY_SERVICES='${{ steps.tags.outputs.services }}' &&
            export API_GATEWAY_TAG=${{ steps.tags.outputs.api-gateway }} &&
            export AUTH_SERVICE_TAG=${{ steps.tags.outputs.auth-service }} &&
            export TRIP_SERVICE_TAG=${{ steps.tags.outputs.trip-service }} &&
            export DOCKER_REGISTRY=${{ secrets.DOCKER_REGISTRY }} &&
            export DOCKER_REPO=${{ secrets.DOCKER_REPO }} &&
            export GITHUB_TOKEN='${{ secrets.GITHUB_TOKEN }}' &&
            export GITHUB_ACTOR='${{ github.actor }}' &&
            export SERVER_IP='${{ secrets.SERVER_IP }}' &&
            export POSTGRES_PASSWORD='${{ secrets.POSTGRES_PASSWORD }}' &&
            export JWT_SECRET_KEY='${{ secrets.JWT_SECRET_KEY }}' &&
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml &&
            echo 'Deploying: api-gateway=${{ steps.tags.outputs.api-gateway }} auth-service=${{ steps.tags.outputs.auth-service }} trip-service=${{ steps.tags.outputs.trip-service }}' &&
            ./deploy.sh
          "

          rm /tmp/ssh_key

  notify:
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy]
    if: always() && github.event_name == 'push' && (needs.build-and-push.result == 'failure' || needs.deploy.result == 'failure') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - name: Optional Telegram notification on CD failure
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID not set — skipping chat notification."
            exit 0
          fi
          MSG="CD failed: ${{ github.repository }} @ ${{ github.ref_name }} ${{ github.sha }} — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          RESP=$(mktemp)
          HTTP_CODE=$(curl -sS -o "$RESP" -w "%{http_code}" -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" || true)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Telegram send failed (HTTP ${HTTP_CODE})."
            echo "Response:"
            cat "$RESP"
            echo "Hint: open chat with bot and press Start, then verify TELEGRAM_CHAT_ID and bot token."
            exit 0
          fi
          echo "Telegram notification sent."
