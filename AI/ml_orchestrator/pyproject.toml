[project]
name = "pinz-ml-orchestrator"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pinz-shared",
    "nats-py>=2.7",
    "httpx>=0.27",
    "grpcio>=1.62",
    "grpcio-health-checking>=1.62",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "Pillow>=10.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
