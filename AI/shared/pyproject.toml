[project]
name = "pinz-shared"
version = "0.1.0"
description = "Shared utilities for Pinz AI microservices"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "nats-py>=2.7",
    "httpx>=0.27",
    "structlog>=24.1",
    "grpcio>=1.62",
    "grpcio-tools>=1.62",
    "protobuf>=4.25",
    "qdrant-client>=1.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
