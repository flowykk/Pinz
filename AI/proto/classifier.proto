syntax = "proto3";

package pinz.ai.classifier;

import "common.proto";

option go_package = "github.com/pinz/ai/proto/classifier;classifierpb";

service Classifier {
  rpc ClassifyPin(ClassifyPinRequest) returns (ClassifyPinResponse);
}

message ClassifyPinRequest {
  string pin_id = 1;
  repeated pinz.ai.common.Embedding image_embeddings = 2;
  string description = 3;
}

message ClassifyPinResponse {
  string pin_id = 1;
  string category = 2;
  repeated string tags = 3;     // <= 10, каждый <= 15 символов
  float  confidence = 4;
}
