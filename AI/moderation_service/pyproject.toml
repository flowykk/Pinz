[project]
name = "pinz-moderation-service"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pinz-shared",
    "grpcio>=1.62",
    "grpcio-health-checking>=1.62",
    "tritonclient[grpc]>=2.43",
    "transformers>=4.40",
    "sentencepiece>=0.1.99",
    "torch>=2.2",
    "Pillow>=10.0",
    "numpy>=1.26",
    "httpx>=0.27",
    "scipy>=1.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
