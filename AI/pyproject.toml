[project]
name = "pinz-ai-dev"
version = "0.1.0"
description = "Dev meta-package: все зависимости AI Module + dev-инструменты"
requires-python = ">=3.11,<3.14"
dependencies = [
    # shared
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "nats-py>=2.7",
    "httpx>=0.27",
    "structlog>=24.1",
    # gRPC — версия grpcio должна совпадать с grpcio-tools (иначе стабы несовместимы)
    "grpcio>=1.81.0",
    "grpcio-tools>=1.81.0",
    "grpcio-health-checking>=1.81.0",
    "protobuf>=4.25",
    # Triton client (только для реального Triton; в тестах мокируем)
    "tritonclient[grpc]>=2.43",
    # ML
    "torch>=2.2",
    "transformers>=4.40",
    "Pillow>=10.0",
    "numpy>=1.26",
    "scipy>=1.11",
    # Хранилища
    "qdrant-client>=1.9",
    "meilisearch-python-sdk>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.2",
    "respx>=0.21",          # mock httpx
    "coverage>=7.4",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 60
markers = [
    "unit: fast tests, no external infra",
    "integration: requires docker infra (NATS, Qdrant, Meilisearch)",
    "slow: heavyweight (model loading, full pipeline)",
]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
