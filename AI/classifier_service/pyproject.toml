[project]
name = "pinz-classifier-service"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pinz-shared",
    "grpcio>=1.62",
    "grpcio-health-checking>=1.62",
    "torch>=2.2",
    "numpy>=1.26",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
