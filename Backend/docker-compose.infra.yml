version: "3.9"

# Два отдельных инстанса PostgreSQL (Database-per-Service):
# db       — Auth Service (pinz_db)
# db-trips — Trip Service (pinz_trips, PostGIS)

services:
  db:
    image: postgres:15-alpine
    container_name: pinz-db
    environment:
      POSTGRES_USER: pinz_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pinz_password}
      POSTGRES_DB: pinz_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pinz_user -d pinz_db"]
      interval: 5s
      timeout: 10s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql/data

  db-trips:
    image: postgis/postgis:15-3.4-alpine
    container_name: pinz-db-trips
    environment:
      POSTGRES_USER: pinz_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pinz_password}
      POSTGRES_DB: pinz_trips
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pinz_user -d pinz_trips"]
      interval: 5s
      timeout: 10s
      retries: 5
    volumes:
      - db_trips_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: pinz-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  db_data:
  db_trips_data:
  redis_data: