version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: pinz-db
    environment:
      POSTGRES_USER: pinz_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pinz_password}
      POSTGRES_DB: pinz_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pinz_user -d pinz_db"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: pinz-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  db_data:
  redis_data: