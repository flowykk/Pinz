      refresh_token:
        type: string
    type: object
  pinz_backend_api-gateway-service_internal_requests.MediaMetaEntry:
    properties:
      captured_at:
        description: ISO8601
        type: string
      content_hash:
        description: e.g. SHA-256 for duplicate detection
        type: string
      latitude:
        type: number
      longitude:
        type: number
      media_type:
        type: string
      s3_key:
        type: string
    type: object
  pinz_backend_api-gateway-service_internal_requests.PasskeyLoginBeginRequest:
    properties:
      email:
        example: user@example.com
        type: string
    type: object
  pinz_backend_api-gateway-service_internal_requests.PasskeyLoginFinishRequest:
    properties:
      credential_json:
        description: CredentialJSON is the PublicKeyCredential (assertion) object
          serialised to JSON by the client.
        format: base64
        type: string
      email:
        example: user@example.com
        type: string
    type: object
  pinz_backend_api-gateway-service_internal_requests.PasskeyRegisterBeginRequest:
    properties:
      registration_id:
        type: string
      username:
