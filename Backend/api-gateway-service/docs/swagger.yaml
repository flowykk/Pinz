host: pinz.website
info:
  contact: {}
  description: API Gateway for Pinz mobile client
  title: Pinz API Gateway
  version: "1.0"
paths:
  /api/v1/auth/dev-login:
    post:
      consumes:
      - application/json
      description: For development use only. Returns access and refresh tokens for
        any existing user without passkey verification.
      parameters:
      - description: User email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/pinz_backend_api-gateway-service_internal_requests.DevLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pinz_backend_api-gateway-service_internal_responses.DevLoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pinz_backend_api-gateway-service_internal_responses.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/pinz_backend_api-gateway-service_internal_responses.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/pinz_backend_api-gateway-service_internal_responses.ErrorResponse'
      summary: Dev login — bypass passkey, get tokens by email only
      tags:
      - auth
  /api/v1/auth/email:
    post:
      consumes:
      - application/json
      description: 'User sends email. Response indicates if user is registered (next
        step: passkey login) or not (next step: email verification). registration_id
        is set only when is_registered is false.'
      parameters:
      - description: Email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/pinz_backend_api-gateway-service_internal_requests.SubmitEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pinz_backend_api-gateway-service_internal_responses.SubmitEmailResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pinz_backend_api-gateway-service_internal_responses.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/pinz_backend_api-gateway-service_internal_responses.ErrorResponse'
      summary: Submit email (login or registration flow)
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/pinz_backend_api-gateway-service_internal_requests.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pinz_backend_api-gateway-service_internal_responses.LogoutResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pinz_backend_api-gateway-service_internal_responses.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/pinz_backend_api-gateway-service_internal_responses.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - auth
