  pinz_backend_api-gateway-service_internal_responses.GetTripReviewResponse:
    properties:
      pins:
        items:
          $ref: '#/definitions/pinz_backend_api-gateway-service_internal_responses.ReviewPin'
        type: array
      similar:
        description: groups of similar media IDs
        items:
          items:
            type: string
          type: array
        type: array
      status:
