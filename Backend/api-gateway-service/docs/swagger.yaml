host: pinz.website
info:
  contact: {}
  description: API Gateway for Pinz mobile client
  title: Pinz API Gateway
  version: "1.0"
paths:
  /api/v1/auth/dev-login:
    post:
      consumes:
      - application/json
      description: For development use only. Returns access and refresh tokens for
        any existing user without passkey verification.
      parameters:
      - description: User email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/pinz_backend_api-gateway-service_internal_requests.DevLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pinz_backend_api-gateway-service_internal_responses.DevLoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pinz_backend_api-gateway-service_internal_responses.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/pinz_backend_api-gateway-service_internal_responses.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/pinz_backend_api-gateway-service_internal_responses.ErrorResponse'
      summary: Dev login — bypass passkey, get tokens by email only
      tags:
      - auth
  /api/v1/auth/email:
    post:
      consumes:
      - application/json
      description: 'User sends email. Response indicates if user is registered (next
        step: passkey login) or not (next step: email verification). registration_id
        is set only when is_registered is false.'
      parameters:
      - description: Email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/pinz_backend_api-gateway-service_internal_requests.SubmitEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pinz_backend_api-gateway-service_internal_responses.SubmitEmailResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pinz_backend_api-gateway-service_internal_responses.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/pinz_backend_api-gateway-service_internal_responses.ErrorResponse'
      summary: Submit email (login or registration flow)
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/pinz_backend_api-gateway-service_internal_requests.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pinz_backend_api-gateway-service_internal_responses.LogoutResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pinz_backend_api-gateway-service_internal_responses.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/pinz_backend_api-gateway-service_internal_responses.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - auth
  /api/v1/auth/passkey/login/begin:
    post:
      consumes:
      - application/json
      description: Returns PublicKeyCredentialRequestOptions (options_json) to pass
        to navigator.credentials.get. Call after /auth/email confirms is_registered=true.
      parameters:
      - description: User email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/pinz_backend_api-gateway-service_internal_requests.PasskeyLoginBeginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pinz_backend_api-gateway-service_internal_responses.PasskeyLoginBeginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pinz_backend_api-gateway-service_internal_responses.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/pinz_backend_api-gateway-service_internal_responses.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/pinz_backend_api-gateway-service_internal_responses.ErrorResponse'
      summary: Begin passkey login (step 1 of 2)
      tags:
      - auth
  /api/v1/auth/passkey/login/finish:
    post:
      consumes:
      - application/json
      description: Verifies the assertion from the authenticator. Returns access and
        refresh tokens.
      parameters:
      - description: User email and assertion credential JSON
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/pinz_backend_api-gateway-service_internal_requests.PasskeyLoginFinishRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pinz_backend_api-gateway-service_internal_responses.PasskeyLoginFinishResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pinz_backend_api-gateway-service_internal_responses.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pinz_backend_api-gateway-service_internal_responses.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/pinz_backend_api-gateway-service_internal_responses.ErrorResponse'
      summary: Finish passkey login (step 2 of 2)
      tags:
      - auth
  /api/v1/auth/passkey/register/begin:
    post:
      consumes:
      - application/json
      description: Returns PublicKeyCredentialCreationOptions (options_json) to pass
        to navigator.credentials.create. Call after email verification.
      parameters:
      - description: Registration ID and username
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/pinz_backend_api-gateway-service_internal_requests.PasskeyRegisterBeginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pinz_backend_api-gateway-service_internal_responses.PasskeyRegisterBeginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pinz_backend_api-gateway-service_internal_responses.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/pinz_backend_api-gateway-service_internal_responses.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/pinz_backend_api-gateway-service_internal_responses.ErrorResponse'
      summary: Begin passkey registration (step 1 of 2)
      tags:
      - auth
  /api/v1/auth/passkey/register/finish:
    post:
      consumes:
      - application/json
      description: Verifies the attestation from the authenticator and creates the
        user account. Returns access and refresh tokens.
      parameters:
      - description: Registration ID and attestation credential JSON
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/pinz_backend_api-gateway-service_internal_requests.PasskeyRegisterFinishRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pinz_backend_api-gateway-service_internal_responses.PasskeyRegisterFinishResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pinz_backend_api-gateway-service_internal_responses.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/pinz_backend_api-gateway-service_internal_responses.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/pinz_backend_api-gateway-service_internal_responses.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/pinz_backend_api-gateway-service_internal_responses.ErrorResponse'
      summary: Finish passkey registration (step 2 of 2)
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/pinz_backend_api-gateway-service_internal_requests.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pinz_backend_api-gateway-service_internal_responses.RefreshTokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pinz_backend_api-gateway-service_internal_responses.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/pinz_backend_api-gateway-service_internal_responses.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/pinz_backend_api-gateway-service_internal_responses.ErrorResponse'
      summary: Refresh access token
      tags:
      - auth
  /api/v1/auth/verify-email:
    post:
      consumes:
      - application/json
      parameters:
      - description: Registration ID and code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/pinz_backend_api-gateway-service_internal_requests.VerifyEmailCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pinz_backend_api-gateway-service_internal_responses.VerifyEmailCodeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/pinz_backend_api-gateway-service_internal_responses.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/pinz_backend_api-gateway-service_internal_responses.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/pinz_backend_api-gateway-service_internal_responses.ErrorResponse'
      summary: Verify email code
      tags:
      - auth
  /api/v1/feed:
    get:
      parameters:
      - description: limit
        in: query
        name: limit
        type: integer
      - description: offset
        in: query
        name: offset
        type: integer
      - description: category
        in: query
        name: category
        type: string
      - description: season
        in: query
        name: season
        type: string
      - description: city name (mutually exclusive with country, city wins)
        in: query
        name: city
        type: string
      - description: country name (mutually exclusive with city)
        in: query
        name: country
        type: string
      - description: date|rating
        in: query
        name: sort_by
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
