---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: default
  labels:
    app: grafana
    component: observability
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
        component: observability
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Admin
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"
            - name: GF_FEATURE_TOGGLES_ENABLE
              value: traceqlEditor
            # При доступе через port-forward (localhost:3000) без этого плагины (Tempo и др.) могут давать ChunkLoadError
            - name: GF_SERVER_ROOT_URL
              value: "http://localhost:3000"
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "false"
          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          volumeMounts:
            - name: grafana-config
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
            - name: grafana-config
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
            - name: grafana-config
              mountPath: /etc/grafana/provisioning/dashboards/pinz-service-overview.json
              subPath: pinz-service-overview.json
            - name: grafana-config
              mountPath: /etc/grafana/provisioning/dashboards/pinz-logs.json
              subPath: pinz-logs.json
            - name: grafana-config
              mountPath: /etc/grafana/provisioning/dashboards/pinz-traces.json
              subPath: pinz-traces.json
      volumes:
        - name: grafana-config
          configMap:
            name: grafana-config
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: default
spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000

# ══════════════════════════════════════════════════════════════════════════════
# NetworkPolicy: allow traffic within the observability stack
# ══════════════════════════════════════════════════════════════════════════════
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-observability-internal
  namespace: default
spec:
  podSelector:
    matchLabels:
      component: observability
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              component: observability
