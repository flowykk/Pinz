# Observability stack: OTel Collector, Tempo, Prometheus, Loki, Promtail, Grafana.
# Promtail (DaemonSet) ships /var/log/pods container logs to Loki on each node.
# All pods carry component=observability — matched by the allow-observability-internal
# NetworkPolicy so they can freely talk to each other.
# Istio sidecar injection is disabled to keep the obs stack simple and avoid
# Envoy-level mTLS complications between collector and backends.
#
# Deploy:   kubectl apply -f k8s/k8s-observability.yaml
# Teardown: kubectl delete -f k8s/k8s-observability.yaml
# Grafana:  kubectl port-forward svc/grafana 3000:3000

# ══════════════════════════════════════════════════════════════════════════════
# OTel Collector
# ══════════════════════════════════════════════════════════════════════════════
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: default
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
          http:
            endpoint: "0.0.0.0:4318"

    processors:
      batch:
        timeout: 5s
        send_batch_size: 1024
      memory_limiter:
        check_interval: 1s
        limit_mib: 256
      resource:
        attributes:
          - key: deployment.environment
            value: "local"
            action: upsert

    exporters:
      otlp/tempo:
        endpoint: "tempo:4317"
        tls:
          insecure: true
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: pinz
      prometheusremotewrite:
        endpoint: "http://prometheus:9090/api/v1/write"
        namespace: pinz
        tls:
          insecure: true
      otlphttp/loki:
        endpoint: "http://loki:3100/otlp"
        tls:
          insecure: true

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/tempo]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [prometheus, prometheusremotewrite]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/loki]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: default
  labels:
    app: otel-collector
    component: observability
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
        component: observability
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.151.0
          args: ["--config=/etc/otelcol/config.yaml"]
          ports:
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
            - containerPort: 8889
              name: metrics
          resources:
            requests:
              cpu: "50m"
              memory: "192Mi"
            limits:
              cpu: "300m"
              memory: "512Mi"
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: default
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: metrics
      port: 8889
      targetPort: 8889

# ══════════════════════════════════════════════════════════════════════════════
# Tempo (traces)
# ══════════════════════════════════════════════════════════════════════════════
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: default
data:
  tempo.yaml: |
    stream_over_http_enabled: true
    multitenancy_enabled: false
    # Disable live-store partition ring so FindTraceByID uses ingester + blocks only (avoids "empty ring" in monolithic).
    partition_ring_live_store: false

    server:
      http_listen_port: 3200
      grpc_listen_port: 9095
      log_level: warn

    distributor:
      ingester_write_path_enabled: true
      kafka_write_path_enabled: false
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318

    ingester:
      trace_idle_period: 10s
      flush_check_period: 10s
      max_block_duration: 5m

    querier:
      query_live_store: false
      trace_by_id:
        query_timeout: 10s

    storage:
      trace:
        backend: local
        local:
          path: /tmp/tempo/blocks
        wal:
          path: /tmp/tempo/wal
        blocklist_poll: 10s
        pool:
          max_workers: 100
          queue_depth: 10000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  namespace: default
  labels:
    app: tempo
    component: observability
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: tempo
  template:
    metadata:
      labels:
        app: tempo
        component: observability
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      containers:
        - name: tempo
          image: grafana/tempo:2.10.1
          args: ["-config.file=/etc/tempo.yaml"]
          ports:
            - containerPort: 3200
              name: http
            - containerPort: 9095
              name: grpc
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
          resources:
            requests:
              cpu: "50m"
              memory: "160Mi"
            limits:
              cpu: "300m"
              memory: "384Mi"
          volumeMounts:
            - name: config
              mountPath: /etc/tempo.yaml
              subPath: tempo.yaml
            - name: data
              mountPath: /tmp/tempo
      volumes:
        - name: config
          configMap:
            name: tempo-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: default
spec:
  selector:
    app: tempo
  ports:
    - name: http
      port: 3200
      targetPort: 3200
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318

# ══════════════════════════════════════════════════════════════════════════════
# Loki (logs)
# ══════════════════════════════════════════════════════════════════════════════
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: default
data:
  loki.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
      log_level: warn

    common:
      instance_addr: 127.0.0.1
      path_prefix: /tmp/loki
      storage:
        filesystem:
          chunks_directory: /tmp/loki/chunks
          rules_directory: /tmp/loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    query_range:
      results_cache:
        cache:
          embedded_cache:
            enabled: true
            max_size_mb: 100

    schema_config:
      configs:
        - from: 2020-10-24
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      allow_structured_metadata: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: default
  labels:
    app: loki
    component: observability
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
        component: observability
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.3.2
          args: ["-config.file=/etc/loki/config.yaml", "-target=all"]
          ports:
            - containerPort: 3100
              name: http
          resources:
            requests:
              cpu: "50m"
              memory: "192Mi"
            limits:
              cpu: "300m"
              memory: "384Mi"
          volumeMounts:
            - name: config
              mountPath: /etc/loki/config.yaml
              subPath: loki.yaml
            - name: data
              mountPath: /tmp/loki
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: default
spec:
  selector:
    app: loki
  ports:
    - name: http
      port: 3100
      targetPort: 3100

# ══════════════════════════════════════════════════════════════════════════════
# Promtail (node log files → Loki; collects infra + app container logs on each node)
# ══════════════════════════════════════════════════════════════════════════════
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: default
  labels:
    component: observability
data:
  promtail.yaml: |
    server:
      http_listen_port: 3101
      grpc_listen_port: 0
    positions:
      filename: /tmp/positions.yaml
    clients:
      - url: http://loki.default.svc.cluster.local:3100/loki/api/v1/push
    scrape_configs:
      - job_name: kubernetes-pods
        static_configs:
          - targets:
              - localhost
            labels:
              job: kubernetes-pods
              __path__: /var/log/pods/*/*/*.log
        pipeline_stages:
          - cri: {}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: default
  labels:
    app: promtail
    component: observability
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
        component: observability
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: default
      securityContext:
        runAsUser: 0
      containers:
        - name: promtail
          image: grafana/promtail:2.9.8
          args:
            - -config.file=/etc/promtail/promtail.yaml
          ports:
            - containerPort: 3101
              name: http-metrics
          resources:
            requests:
              cpu: "25m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            # Whole /var/log: pod log symlinks on containerd often resolve under /var/log/containers.
            - name: varlog
              mountPath: /var/log
              readOnly: true
            # Docker/CRI-O: entries under /var/log/pods/.../*.log may symlink here (e.g. Minikube docker driver).
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: positions
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: varlog
          hostPath:
            path: /var/log
            type: Directory
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
            type: DirectoryOrCreate
        - name: positions
          emptyDir: {}

# ══════════════════════════════════════════════════════════════════════════════
# Prometheus (metrics)
# ══════════════════════════════════════════════════════════════════════════════
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: default
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: otel-collector
        scrape_interval: 10s
        metrics_path: /metrics
        static_configs:
          - targets: ["otel-collector:8889"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: default
  labels:
    app: prometheus
    component: observability
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
        component: observability
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--web.enable-remote-write-receiver"
          ports:
            - containerPort: 9090
              name: http
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: default
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090

# ══════════════════════════════════════════════════════════════════════════════
# Grafana (visualization)
# ══════════════════════════════════════════════════════════════════════════════
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: default
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Tempo
        type: tempo
        uid: tempo
        url: http://tempo:3200
        access: proxy
        isDefault: false
        jsonData:
          httpMethod: GET
          serviceMap:
            datasourceUid: prometheus
          nodeGraph:
            enabled: true
          lokiSearch:
            datasourceUid: loki
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: "-1m"
            spanEndTimeShift: "1m"
            filterByTraceID: true
          tracesToMetrics:
            datasourceUid: prometheus
            tags:
              - key: service.name
                value: service_name

      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus:9090
        access: proxy
        isDefault: true
        jsonData:
          exemplarTraceIdDestinations:
            - datasourceUid: tempo
              name: trace_id

      - name: Loki
        type: loki
        uid: loki
        url: http://loki:3100
        access: proxy
        isDefault: false
        jsonData:
          derivedFields:
            - datasourceUid: tempo
              matcherRegex: '"trace_id":"(\w+)"'
              name: TraceID
              url: "$${__value.raw}"

  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: Pinz Dashboards
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: false
        options:
          path: /etc/grafana/provisioning/dashboards

  pinz-service-overview.json: |
    {
      "__inputs": [],
      "__requires": [],
      "annotations": { "list": [] },
      "description": "Pinz services — RED metrics, auth business counters, Go runtime",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [
        { "asDropdown": false, "icon": "doc", "includeVars": true, "keepTime": true, "tags": ["pinz", "observability"], "targetBlank": false, "title": "Logs", "tooltip": "", "type": "dashboard", "uid": "pinz-logs" },
        { "asDropdown": false, "icon": "list-ul", "includeVars": true, "keepTime": true, "tags": ["pinz", "observability"], "targetBlank": false, "title": "Traces", "tooltip": "", "type": "dashboard", "uid": "pinz-traces" }
      ],
      "panels": [
        { "collapsed": false, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }, "id": 1, "title": "API Gateway — HTTP", "type": "row" },
        { "datasource": { "type": "prometheus", "uid": "prometheus" }, "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "unit": "reqps" } }, "gridPos": { "h": 8, "w": 8, "x": 0, "y": 1 }, "id": 2, "options": { "tooltip": { "mode": "multi" } }, "targets": [ { "expr": "sum(rate(pinz_http_server_request_duration_seconds_count[1m])) by (http_request_method, http_route)", "legendFormat": "{{http_request_method}} {{http_route}}", "refId": "A" } ], "title": "Request Rate", "type": "timeseries" },
        { "datasource": { "type": "prometheus", "uid": "prometheus" }, "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "unit": "percentunit" } }, "gridPos": { "h": 8, "w": 8, "x": 8, "y": 1 }, "id": 3, "targets": [ { "expr": "sum(rate(pinz_http_server_request_duration_seconds_count{http_response_status_code=~\"5..\"}[1m])) / sum(rate(pinz_http_server_request_duration_seconds_count[1m]))", "legendFormat": "Error rate", "refId": "A" } ], "title": "Error Rate (5xx)", "type": "timeseries" },
        { "datasource": { "type": "prometheus", "uid": "prometheus" }, "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "unit": "s" } }, "gridPos": { "h": 8, "w": 8, "x": 16, "y": 1 }, "id": 4, "targets": [ { "expr": "histogram_quantile(0.99, sum(rate(pinz_http_server_request_duration_seconds_bucket[1m])) by (le))", "legendFormat": "p99", "refId": "A" }, { "expr": "histogram_quantile(0.95, sum(rate(pinz_http_server_request_duration_seconds_bucket[1m])) by (le))", "legendFormat": "p95", "refId": "B" }, { "expr": "histogram_quantile(0.50, sum(rate(pinz_http_server_request_duration_seconds_bucket[1m])) by (le))", "legendFormat": "p50", "refId": "C" } ], "title": "Request Duration", "type": "timeseries" },
        { "collapsed": false, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 9 }, "id": 5, "title": "Auth Service — gRPC", "type": "row" },
        { "datasource": { "type": "prometheus", "uid": "prometheus" }, "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "unit": "reqps" } }, "gridPos": { "h": 8, "w": 8, "x": 0, "y": 10 }, "id": 6, "targets": [ { "expr": "sum(rate(pinz_rpc_server_call_duration_seconds_count{job=\"auth-service\"}[1m])) by (rpc_method)", "legendFormat": "{{rpc_method}}", "refId": "A" } ], "title": "gRPC Request Rate (auth-service)", "type": "timeseries" },
        { "datasource": { "type": "prometheus", "uid": "prometheus" }, "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "unit": "ms" } }, "gridPos": { "h": 8, "w": 8, "x": 8, "y": 10 }, "id": 7, "targets": [ { "expr": "histogram_quantile(0.99, sum(rate(pinz_rpc_server_call_duration_seconds_bucket{job=\"auth-service\"}[1m])) by (le, rpc_method))", "legendFormat": "p99 {{rpc_method}}", "refId": "A" } ], "title": "gRPC Duration p99 (auth-service)", "type": "timeseries" },
        { "datasource": { "type": "prometheus", "uid": "prometheus" }, "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "unit": "short" } }, "gridPos": { "h": 8, "w": 8, "x": 16, "y": 10 }, "id": 8, "targets": [ { "expr": "sum(rate(pinz_rpc_server_call_duration_seconds_count{job=\"auth-service\",rpc_response_status_code!=\"OK\"}[1m])) by (rpc_method)", "legendFormat": "errors {{rpc_method}}", "refId": "A" } ], "title": "gRPC Error Rate (auth-service)", "type": "timeseries" },
        { "collapsed": false, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 18 }, "id": 17, "title": "Trip Service — gRPC", "type": "row" },
        { "datasource": { "type": "prometheus", "uid": "prometheus" }, "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "unit": "reqps" } }, "gridPos": { "h": 8, "w": 8, "x": 0, "y": 19 }, "id": 18, "targets": [ { "expr": "sum(rate(pinz_rpc_server_call_duration_seconds_count{job=\"trip-service\"}[1m])) by (rpc_method)", "legendFormat": "{{rpc_method}}", "refId": "A" } ], "title": "gRPC Request Rate (trip-service)", "type": "timeseries" },
        { "datasource": { "type": "prometheus", "uid": "prometheus" }, "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "unit": "ms" } }, "gridPos": { "h": 8, "w": 8, "x": 8, "y": 19 }, "id": 19, "targets": [ { "expr": "histogram_quantile(0.99, sum(rate(pinz_rpc_server_call_duration_seconds_bucket{job=\"trip-service\"}[1m])) by (le, rpc_method))", "legendFormat": "p99 {{rpc_method}}", "refId": "A" } ], "title": "gRPC Duration p99 (trip-service)", "type": "timeseries" },
        { "datasource": { "type": "prometheus", "uid": "prometheus" }, "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "unit": "short" } }, "gridPos": { "h": 8, "w": 8, "x": 16, "y": 19 }, "id": 20, "targets": [ { "expr": "sum(rate(pinz_rpc_server_call_duration_seconds_count{job=\"trip-service\",rpc_response_status_code!=\"OK\"}[1m])) by (rpc_method)", "legendFormat": "errors {{rpc_method}}", "refId": "A" } ], "title": "gRPC Error Rate (trip-service)", "type": "timeseries" },
        { "collapsed": false, "gridPos": { "h": 1, "w": 24, "x": 0, "y": 27 }, "id": 9, "title": "Auth Business Metrics", "type": "row" },
        { "datasource": { "type": "prometheus", "uid": "prometheus" }, "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "unit": "short" } }, "gridPos": { "h": 8, "w": 8, "x": 0, "y": 28 }, "id": 10, "targets": [ { "expr": "sum(increase(pinz_auth_logins_total{job=\"auth-service\"}[5m])) by (method, status)", "legendFormat": "{{method}} / {{status}}", "refId": "A" } ], "title": "Logins (5m window)", "type": "timeseries" },
        { "datasource": { "type": "prometheus", "uid": "prometheus" }, "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "unit": "short" } }, "gridPos": { "h": 8, "w": 8, "x": 8, "y": 28 }, "id": 11, "targets": [ { "expr": "sum(increase(pinz_auth_registrations_total{job=\"auth-service\"}[5m])) by (status)", "legendFormat": "{{status}}", "refId": "A" } ], "title": "Registrations (5m window)", "type": "timeseries" },
