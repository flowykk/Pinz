apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: default
spec:
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: v1
kind: Endpoints
metadata:
  name: db
  namespace: default
subsets:
- addresses:
  - ip: ${SERVER_IP}
  ports:
  - port: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: default
spec:
  ports:
  - port: 6379
    targetPort: 6379
---
apiVersion: v1
kind: Endpoints
metadata:
  name: redis
  namespace: default
subsets:
- addresses:
  - ip: ${SERVER_IP}
  ports:
  - port: 6379
