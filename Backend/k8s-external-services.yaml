apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: default
spec:
  type: ExternalName
  externalName: host.docker.internal
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: default
spec:
  type: ExternalName
  externalName: host.docker.internal
  ports:
  - port: 6379
    targetPort: 6379