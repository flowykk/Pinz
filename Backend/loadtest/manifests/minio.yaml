apiVersion: v1
kind: Namespace
metadata:
  name: pinz-loadtest
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: pinz-loadtest
spec:
  replicas: 1
  selector:
    matchLabels: {app: minio}
  template:
    metadata:
      labels: {app: minio}
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-09-22T00-33-43Z
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - {name: MINIO_ROOT_USER, value: "minioadmin"}
            - {name: MINIO_ROOT_PASSWORD, value: "minioadmin"}
          ports:
            - {containerPort: 9000, name: api}
            - {containerPort: 9001, name: console}
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: 9000}
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: pinz-loadtest
spec:
  selector: {app: minio}
  ports:
    - {name: api,     port: 9000, targetPort: 9000}
    - {name: console, port: 9001, targetPort: 9001}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-bucket
  namespace: pinz-loadtest
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:RELEASE.2024-09-16T17-43-14Z
          command:
            - /bin/sh
            - -c
            - |
              mc alias set local http://minio.pinz-loadtest.svc.cluster.local:9000 minioadmin minioadmin
              mc mb --ignore-existing local/pinz-loadtest
              mc anonymous set download local/pinz-loadtest
