apiVersion: apps/v1
kind: Deployment
metadata:
  name: geo-stub
  namespace: pinz-loadtest
spec:
  replicas: 1
  selector:
    matchLabels: {app: geo-stub}
  template:
    metadata:
      labels: {app: geo-stub}
    spec:
      containers:
        - name: geo-stub
          image: pinz/geo-stub:loadtest
          imagePullPolicy: IfNotPresent
          ports:
            - {containerPort: 8080, name: http}
          readinessProbe:
            httpGet: {path: /, port: 8080}
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: geo-stub
  namespace: pinz-loadtest
spec:
  selector: {app: geo-stub}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
