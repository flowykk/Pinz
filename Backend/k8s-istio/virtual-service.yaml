apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: api-gateway
  namespace: default
spec:
  hosts:
    - "*"
  gateways:
    - pinz-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: api-gateway.default.svc.cluster.local
            port:
              number: 8080
