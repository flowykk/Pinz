apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: api-gateway
  namespace: default
spec:
  hosts:
    - "pinz.website"
  gateways:
    - pinz-gateway
  http:
    - match:
        - uri:
            prefix: /.well-known/acme-challenge/
      route:
        - destination:
            host: acme-challenge.istio-system.svc.cluster.local
            port:
              number: 80
    - match:
        - uri:
            prefix: /health
      route:
        - destination:
            host: api-gateway.default.svc.cluster.local
            port:
              number: 8080
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: api-gateway.default.svc.cluster.local
            port:
              number: 8080
