# VirtualService для локальной разработки (Minikube).
# Принимает pinz.example.com на порту 80 и отправляет напрямую в api-gateway,
# без редиректа на HTTPS (TLS-сертификат в Minikube не настроен).
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: api-gateway-local
  namespace: default
spec:
  hosts:
    - "pinz.example.com"
  gateways:
    - pinz-gateway
  http:
    - route:
        - destination:
            host: api-gateway.default.svc.cluster.local
            port:
              number: 8080
