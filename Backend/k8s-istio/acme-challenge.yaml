apiVersion: apps/v1
kind: Deployment
metadata:
  name: acme-challenge
  namespace: istio-system
  labels:
    app: acme-challenge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: acme-challenge
  template:
    metadata:
      labels:
        app: acme-challenge
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: webroot
              mountPath: /usr/share/nginx/html
      volumes:
        - name: webroot
          hostPath:
            path: /var/www/acme-challenge
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: acme-challenge
  namespace: istio-system
spec:
  selector:
    app: acme-challenge
  ports:
    - name: http
      port: 80
      targetPort: 80
