services:
  db:
    image: postgres:15-alpine
    container_name: pinz-db
    environment:
      POSTGRES_USER: pinz_user
      POSTGRES_PASSWORD: pinz_password
      POSTGRES_DB: pinz_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pinz_user -d pinz_db"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: pinz-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api-gateway-service:
    build: ./api-gateway-service
    container_name: pinz-api-gateway-service
    environment:
      API_GATEWAY_PORT: "8080"
      # Имя хоста — имя сервиса в Compose (auth-service), не container_name (pinz-auth-service)
      AUTH_SERVICE_GRPC_ADDRESS: auth-service:50051
    ports:
      - "8080:8080"
    depends_on:
      auth-service:
        condition: service_started

  auth-service:
    build: ./auth-service
    container_name: pinz-auth-service
    environment:
      GRPC_PORT: ":50051"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: pinz_user
      DB_PASSWORD: pinz_password
      DB_NAME: pinz_db
      REDIS_ADDR: redis:6379
      JWT_SECRET_KEY: change-me-in-production
    ports:
      - "50051:50051"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  db_data:
  redis_data:
