services:
  db:
    image: postgres:15-alpine
    container_name: pinz-db
    environment:
      POSTGRES_USER: pinz_user
      POSTGRES_PASSWORD: pinz_password
      POSTGRES_DB: pinz_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pinz_user -d pinz_db"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: pinz-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: pinz-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol/config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    depends_on:
      - tempo
      - loki

  tempo:
    image: grafana/tempo:latest
    container_name: pinz-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml
      - tempo_data:/tmp/tempo
    ports:
      - "3200:3200"

  prometheus:
    image: prom/prometheus:latest
    container_name: pinz-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  loki:
    image: grafana/loki:latest
    container_name: pinz-loki
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/config.yaml
      - loki_data:/tmp/loki
    ports:
      - "3100:3100"

  grafana:
    image: grafana/grafana:latest
    container_name: pinz-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_FEATURE_TOGGLES_ENABLE: "traceqlEditor"
    volumes:
      - ./observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ./observability/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml
      - ./observability/dashboards:/etc/grafana/provisioning/dashboards
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
      - loki

  api-gateway-service:
    build:
      context: .
      dockerfile: ./api-gateway-service/Dockerfile
    container_name: pinz-api-gateway-service
    environment:
      API_GATEWAY_PORT: "8080"
      AUTH_SERVICE_GRPC_ADDRESS: auth-service:50051
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_SERVICE_NAME: api-gateway-service
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=local
    ports:
      - "8080:8080"
    depends_on:
      auth-service:
        condition: service_started
      otel-collector:
        condition: service_started

  auth-service:
    build:
      context: .
      dockerfile: ./auth-service/Dockerfile
    container_name: pinz-auth-service
    environment:
      GRPC_PORT: ":50051"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: pinz_user
      DB_PASSWORD: pinz_password
      DB_NAME: pinz_db
      REDIS_ADDR: redis:6379
      JWT_SECRET_KEY: change-me-in-production
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_SERVICE_NAME: auth-service
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=local
    ports:
      - "50051:50051"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      otel-collector:
        condition: service_started

volumes:
  db_data:
  redis_data:
  tempo_data:
  prometheus_data:
  loki_data:
  grafana_data:
