name: CI

on:
  push:
    branches: [main, develop, 'PINZ-*']
    paths:
      - 'Backend/**'
      - 'proto/**'
      - '.github/workflows/ci.yaml'
  pull_request:
    branches: [main, develop, 'PINZ-*']
    paths:
      - 'Backend/**'
      - 'proto/**'
      - '.github/workflows/ci.yaml'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Lint api-gateway-service
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: Backend/api-gateway-service

      - name: Lint auth-service
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: Backend/auth-service

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway-service, auth-service]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run tests
        run: go test ./...
        working-directory: Backend/${{ matrix.service }}
        env:
          JWT_SECRET_KEY: test-secret

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build api-gateway-service
        run: docker build -t api-gateway-service:v${{ github.sha }} -f Backend/api-gateway-service/Dockerfile Backend/api-gateway-service

      - name: Build auth-service
        run: docker build -t auth-service:v${{ github.sha }} -f Backend/auth-service/Dockerfile Backend/auth-service

  proto-check:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.modified, 'proto/') || contains(github.event.head_commit.modified, 'Backend/proto/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - name: Generate proto files
        run: make proto
        working-directory: Backend

      - name: Check for changes in generated proto files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Proto files are not up to date. Please run 'make proto' and commit the changes."
            git status
            exit 1
          fi

  swagger-check:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.modified, 'api-gateway-service/') || contains(github.event.head_commit.modified, 'Backend/api-gateway-service/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install swag
        run: go install github.com/swaggo/swag/cmd/swag@latest

      - name: Generate swagger docs
        run: make swagger
        working-directory: Backend

      - name: Check for changes in swagger files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Swagger files are not up to date. Please run 'make swagger' and commit the changes."
            git status
            exit 1
          fi