version: "2"
sql:
  - engine: "postgresql"
    queries: "queries"
    schema: "internal/db/migrations"
    gen:
      go:
        package: "sqlcdb"
        out: "internal/db/sqlcdb"
        sql_package: "database/sql"
        emit_empty_slices: true
        overrides:
          - db_type: "geometry"
            go_type: "string"
