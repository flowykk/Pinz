syntax = "proto3";

package trip;

option go_package = "pinz/backend/trip-service/pkg/proto";

service TripService {
 rpc CreateTrip(CreateTripRequest) returns (CreateTripResponse);
 rpc GetTrip(GetTripRequest) returns (GetTripResponse);
 rpc ListUserTrips(ListUserTripsRequest) returns (ListUserTripsResponse);
 rpc UpdateTrip(UpdateTripRequest) returns (UpdateTripResponse);
 rpc DeleteTrip(DeleteTripRequest) returns (DeleteTripResponse);
 // Per-user приватность (ТЗ 6.4-6.7): каждый участник выставляет свой уровень,
 // эффективный privacy_level пересчитывается синхронно по AggregatePrivacyLevel.
 rpc UpsertTripPrivacy(UpsertTripPrivacyRequest) returns (UpsertPrivacyResponse);
 rpc UpsertPinPrivacy(UpsertPinPrivacyRequest) returns (UpsertPrivacyResponse);
 rpc UpsertMediaPrivacy(UpsertMediaPrivacyRequest) returns (UpsertPrivacyResponse);
 // Обложка трипа (двухшаговый поток, аналогичный аватару пользователя)
 rpc RequestTripCoverUpload(RequestTripCoverUploadRequest) returns (RequestTripCoverUploadResponse);
 rpc ConfirmTripCoverUpload(ConfirmTripCoverUploadRequest) returns (ConfirmTripCoverUploadResponse);
 rpc DeleteTripCover(DeleteTripCoverRequest) returns (DeleteTripCoverResponse);
 // Участники и инвайты (Фаза 2)
 rpc GenerateInviteLink(GenerateInviteLinkRequest) returns (GenerateInviteLinkResponse);
 rpc JoinTripByToken(JoinTripByTokenRequest) returns (JoinTripByTokenResponse);
 rpc RemoveParticipant(RemoveParticipantRequest) returns (RemoveParticipantResponse);
 rpc LeaveTrip(LeaveTripRequest) returns (LeaveTripResponse);
 rpc TransferAdmin(TransferAdminRequest) returns (TransferAdminResponse);
 // Поток создания (tripCreationFlow.md), Фаза 3/5:
 rpc ProcessMediaGrouping(ProcessMediaGroupingRequest) returns (ProcessMediaGroupingResponse);
 rpc ApplyGroupsAndProcess(ApplyGroupsAndProcessRequest) returns (ApplyGroupsAndProcessResponse);
 rpc GetTripReview(GetTripReviewRequest) returns (GetTripReviewResponse);
 rpc FinalizeTrip(FinalizeTripRequest) returns (FinalizeTripResponse);
 // Публикация в ленту (ТЗ 3.3): вся поездка целиком или выбранные пины
 rpc PublishTrip(PublishTripRequest) returns (PublishTripResponse);
 // лента, лайки, избранное, настройки уведомлений
 rpc UpdateTripSettings(UpdateTripSettingsRequest) returns (UpdateTripSettingsResponse);
 rpc ListFeed(ListFeedRequest) returns (ListFeedResponse);
 rpc LikeTrip(LikeTripRequest) returns (LikeTripResponse);
 rpc DislikeTrip(DislikeTripRequest) returns (DislikeTripResponse);
 rpc AddToFavourites(AddToFavouritesRequest) returns (AddToFavouritesResponse);
 rpc RemoveFromFavourites(RemoveFromFavouritesRequest) returns (RemoveFromFavouritesResponse);
 rpc ListFavourites(ListFavouritesRequest) returns (ListFavouritesResponse);
 // Добавление медиа в существующий трип (ТЗ 5.1-5.3)
 rpc AddMediaStart(AddMediaStartRequest) returns (AddMediaStartResponse);
 rpc AddMediaRequestUploadUrls(AddMediaRequestUploadUrlsRequest) returns (AddMediaRequestUploadUrlsResponse);
 rpc AddMediaCommitUpload(AddMediaCommitUploadRequest) returns (AddMediaCommitUploadResponse);
 rpc AddMediaGetSessionMedia(AddMediaGetSessionMediaRequest) returns (AddMediaGetSessionMediaResponse);
 rpc AddMediaProcessGrouping(AddMediaProcessGroupingRequest) returns (AddMediaProcessGroupingResponse);
 rpc AddMediaGetGrouping(AddMediaGetGroupingRequest) returns (AddMediaGetGroupingResponse);
 rpc AddMediaApplyGroupsAndProcess(AddMediaApplyGroupsAndProcessRequest) returns (AddMediaApplyGroupsAndProcessResponse);
 rpc AddMediaGetReview(AddMediaGetReviewRequest) returns (AddMediaGetReviewResponse);
 rpc AddMediaConfirm(AddMediaConfirmRequest) returns (AddMediaConfirmResponse);
 rpc AddMediaCancel(AddMediaCancelRequest) returns (AddMediaCancelResponse);
 rpc AddMediaTakeover(AddMediaTakeoverRequest) returns (AddMediaTakeoverResponse);
 // лёгкая сводка по всем трипам пользователя для statistics/profile
 rpc ListUserTripSummaries(ListUserTripSummariesRequest) returns (ListUserTripSummariesResponse);
 // фотобатлы и "лучшие воспоминания" (ТЗ 8)
 rpc StartBattle(StartBattleRequest) returns (StartBattleResponse);
 rpc SubmitBattleResult(SubmitBattleResultRequest) returns (SubmitBattleResultResponse);
 rpc GetBestMemories(GetBestMemoriesRequest) returns (GetBestMemoriesResponse);
 // поддержка notification-service — настройки уведомлений и таймерные выборки трипов.
 rpc GetNotificationSettings(GetNotificationSettingsRequest) returns (GetNotificationSettingsResponse);
 rpc ListAnniversaryTrips(ListAnniversaryTripsRequest) returns (ListAnniversaryTripsResponse);
 rpc ListEndedMonthAgoTrips(ListEndedMonthAgoTripsRequest) returns (ListEndedMonthAgoTripsResponse);
 rpc ListTripParticipants(ListTripParticipantsRequest) returns (ListTripParticipantsResponse);
 // текстовый поиск пинов в трипах пользователя (по name/description/tags)
 rpc SearchPins(SearchPinsRequest) returns (SearchPinsResponse);
 // Pin RUD на READY-трипе (ТЗ 4.2-4.5; Create-флоу — отдельная задача)
 rpc GetPin(GetPinRequest) returns (GetPinResponse);
 rpc UpdatePin(UpdatePinRequest) returns (UpdatePinResponse);
 rpc DeletePin(DeletePinRequest) returns (DeletePinResponse);
 // Sessionless удаление одного медиа из пина (ТЗ 4.2.3)
 rpc RemoveMediaFromPin(RemoveMediaFromPinRequest) returns (RemoveMediaFromPinResponse);
 // Унифицированный pin-upload: target_pin_id nil → создание пина, заполнен → добавление медиа.
 rpc PinUploadStart(PinUploadStartRequest) returns (PinUploadStartResponse);
 rpc RequestPinUploadUrls(RequestPinUploadUrlsRequest) returns (RequestPinUploadUrlsResponse);
 rpc CommitPinUpload(CommitPinUploadRequest) returns (CommitPinUploadResponse);
 rpc ProcessPinUpload(ProcessPinUploadRequest) returns (ProcessPinUploadResponse);
 rpc GetPinUploadReview(GetPinUploadReviewRequest) returns (GetPinUploadReviewResponse);
 rpc FinalizePinUpload(FinalizePinUploadRequest) returns (FinalizePinUploadResponse);
 rpc CancelPinUpload(CancelPinUploadRequest) returns (CancelPinUploadResponse);
 // Рекомендации (ТЗ 9): карта популярных мест по городу/стране и
 // материализация её как сохранённого трипа.
 rpc GetRecommendations(GetRecommendationsRequest) returns (GetRecommendationsResponse);
 rpc SaveRecommendation(SaveRecommendationRequest) returns (SaveRecommendationResponse);
}

message Trip {
 string id = 1;
 string owner_user_id = 2;
 string name = 3;
 string description = 4;
 string category = 5;
 string season = 6;
 string status = 7;
 string privacy_level = 8;
 int64 start_date_unix = 9;
 int64 end_date_unix = 10;
 int32 likes_count = 11;
 int32 dislikes_count = 12;
 string cover_url = 13;
 bool is_published = 14;
 bool is_generated = 15;
 int64 created_at_unix = 16;
 int64 updated_at_unix = 17;
 int32 media_count = 18;
 int32 participants_count = 19;
 int32 pins_count = 20;
 bool name_censored = 21;
 bool description_censored = 22;
}

message CreateTripRequest {
 reserved 6;
 reserved "privacy_level";
 string owner_user_id = 1;
 string name = 2;
 string description = 3;
 string category = 4;
 string season = 5;
 repeated FileToUpload files_to_upload = 7;
}

message FileToUpload {
 string client_id = 1;
 string content_type = 2;
}

message CreateTripResponse {
 string trip_id = 1;
 string status = 2;
 repeated UploadUrl upload_urls = 3;
}

message UploadUrl {
 string client_id = 1;
 string s3_key = 2;
 string url = 3;
}

message GetTripRequest {
 string trip_id = 1;
 string user_id = 2;
}

// TripPin is a pin with media for GetTrip response (map view).
message TripPin {
 string id = 1;
 string name = 2;
 string description = 3;
 string category = 4;
 optional double latitude = 5;
 optional double longitude = 6;
 int64 start_time_unix = 7;
 int64 end_time_unix = 8;
 string privacy_level = 9;
 repeated string tags = 10;
 repeated TripPinMedia media = 11;
 string trip_id = 12;
 bool name_censored = 13;
 bool description_censored = 14;
}
message TripPinMedia {
 string media_id = 1;
 string url = 2; // presigned or CDN URL; may be empty if resolved elsewhere
 string media_type = 3; // image, video
 int64 captured_at_unix = 4;
 string privacy_level = 5;
}

message GetTripResponse {
 Trip trip = 1;
 repeated TripPin pins = 2;
 // если есть активная add-media-сессия, клиент получает её здесь.
 // Null, если нет. Используется клиентом для роутинга на экран сессии.
 optional ActiveAddMediaSession active_add_media_session = 3;
 // участники трипа с per-user privacy_level и ролью; username/avatar_url
 // дозаполняет gateway через auth.GetUsersProfiles.
 repeated TripParticipant participants = 4;
 // расширяемый bag per-user настроек текущего юзера (notifications_enabled,
 // privacy_level, тема и т.д.).
 TripSettings current_user_settings = 5;
}

// TripParticipant — участник трипа для ответа GetTrip.
// privacy_level — выбор этого юзера из trip_privacy ("private" если записи нет).
// role — "admin" | "member".
message TripParticipant {
 string user_id = 1;
 string username = 2;
 string avatar_url = 3;
 string privacy_level = 4;
 string role = 5;
}

// TripSettings — per-user настройки текущего юзера на трипе. Расширяемый bag:
// сюда добавляем новые per-user настройки (тема и т.п.) вместо новых эндпоинтов.
message TripSettings {
 bool notifications_enabled = 1;
 string privacy_level = 2;
}

// активная add-media-сессия для трипа. Отдается в GetTripResponse.
// current_initiator_user_id null до вызова AddMediaApplyGroupsAndProcess.
message ActiveAddMediaSession {
 string session_id = 1;
 optional string current_initiator_user_id = 2;
 optional int64 initiator_assigned_at_unix = 3;
 optional int64 takeover_available_at_unix = 4;
 int32 media_count_in_session = 5;
}

message ListUserTripsRequest {
 string user_id = 1;
 int32 limit = 2;
 int32 offset = 3;
}

message ListUserTripsResponse {
 repeated Trip trips = 1;
}

message UpdateTripRequest {
 reserved 7;
 reserved "privacy_level";
 string trip_id = 1;
 string user_id = 2;
 optional string name = 3;
 optional string description = 4;
 optional string category = 5;
 optional string season = 6;
 optional int64 start_date_unix = 8;
 optional int64 end_date_unix = 9;
}

message UpdateTripResponse {
 Trip trip = 1;
}

message DeleteTripRequest {
 string trip_id = 1;
 string user_id = 2;
}

message DeleteTripResponse {
 bool success = 1;
}

// Обложка трипа: запрос presigned PUT URL для загрузки в S3 (step 1)
message RequestTripCoverUploadRequest {
 string trip_id = 1;
 string user_id = 2;
 string filename = 3;
 string content_type = 4;
}
message RequestTripCoverUploadResponse {
 string upload_url = 1;
 string s3_key = 2;
}

// Обложка трипа: подтверждение загрузки (step 2), обновление cover_url и best-effort удаление старого объекта
message ConfirmTripCoverUploadRequest {
 string trip_id = 1;
 string user_id = 2;
 string s3_key = 3;
}
message ConfirmTripCoverUploadResponse {
 Trip trip = 1;
}

// Удаление обложки трипа: чистит cover_url и best-effort удаляет объект из S3
message DeleteTripCoverRequest {
 string trip_id = 1;
 string user_id = 2;
}
message DeleteTripCoverResponse {
 Trip trip = 1;
}

// PublishTrip: отдельный флоу публикации в общую ленту (ТЗ 3.3,).
// publish_whole=true публикует всю поездку; иначе публикуются только выбранные пины (pin_ids).
message PublishTripRequest {
 string trip_id = 1;
 bool publish_whole = 2;
 repeated string pin_ids = 3;
}

message PublishTripResponse {
 Trip trip = 1;
}

// ProcessMediaGrouping: save media, cluster by geo/time, return draft_pins (tripCreationFlow.md stage 2)
message ProcessMediaGroupingRequest {
 string trip_id = 1;
 repeated MediaMeta media = 2;
}
message MediaMeta {
 string s3_key = 1;
 string media_type = 2; // image, video
 int64 captured_at_unix = 3;
 optional double latitude = 4;
 optional double longitude = 5;
}
message ProcessMediaGroupingResponse {
 string trip_id = 1;
 string status = 2;
 repeated DraftPin draft_pins = 3;
}
message DraftPin {
 string draft_pin_id = 1;
 repeated DraftPinMedia media = 2;
}
message DraftPinMedia {
 string media_id = 1;
 string url = 2; // read URL (from Media Service or placeholder)
 string type = 3; // image, video
}

// ApplyGroupsAndProcess: apply user grouping, create pins, push to Redis Streams, return 202
message ApplyGroupsAndProcessRequest {
 string trip_id = 1;
 repeated DraftPinInput draft_pins = 2;
 repeated string deleted_media_ids = 3;
}
message DraftPinInput {
 string draft_pin_id = 1;
 repeated string media_ids = 2;
}
message ApplyGroupsAndProcessResponse {
 string message = 1;
 string status = 2;
}

// GetTripReview: pins with tags, geo, issues, similar (tripCreationFlow.md stage 4)
message GetTripReviewRequest {
 string trip_id = 1;
}
message GetTripReviewResponse {
 string trip_id = 1;
 string status = 2;
 repeated MediaSimilarGroup similar = 3;
 repeated ReviewPin pins = 4;
}
message MediaSimilarGroup {
 repeated string media_ids = 1;
}
message ReviewPin {
 string pin_id = 1;
 string name = 2;
 string category = 3;
 optional double latitude = 4;
 optional double longitude = 5;
 string location_name = 6;
 int64 start_time_unix = 7;
 int64 end_time_unix = 8;
 repeated string issues = 9; // MISSING_COORDINATES, MISSING_DATES
 repeated string tags = 10;
 repeated ReviewPinMedia media = 11;
 bool name_censored = 12;
}
message ReviewPinMedia {
 string media_id = 1;
 string url = 2;
 string privacy_level = 4;
}

// FinalizeTrip: apply pin_updates, delete media, reverse geocoding, aggregate trip, READY, TRIP_READY
message FinalizeTripRequest {
 string trip_id = 1;
 repeated PinUpdate pin_updates = 2;
 repeated string media_to_delete = 3;
}
message PinUpdate {
 string pin_id = 1;
 optional string name = 2;
 optional double latitude = 3;
 optional double longitude = 4;
 // TODO: add optional string description = 5; with validation <= 5000 chars (ТЗ 4.2.8)
 // TODO: add repeated string tags = 6; with validation <= 10 tags, each <= 15 chars (ТЗ 4.2.4-4.2.5)
}
message FinalizeTripResponse {
 string trip_id = 1;
 string status = 2;
 string message = 3;
}

// Участники и инвайты
message GenerateInviteLinkRequest {
 string trip_id = 1;
 int64 expires_in_seconds = 2; // TTL ссылки, например 86400 = 24 часа
}
message GenerateInviteLinkResponse {
 string invite_link_id = 1;
 string token = 2;
 string invite_url = 3; // полный URL для шаринга (клиент или gateway может собрать)
 int64 expires_at_unix = 4;
}

message JoinTripByTokenRequest {
 string token = 1;
}
message JoinTripByTokenResponse {
 string trip_id = 1;
 bool already_joined = 2;
}

message RemoveParticipantRequest {
 string trip_id = 1;
 string user_id = 2; // участник, которого удаляем
}
message RemoveParticipantResponse {
 bool success = 1;
}

message LeaveTripRequest {
 string trip_id = 1;
}
message LeaveTripResponse {
 bool success = 1;
 bool trip_deleted = 2; // true если трип удалён (был единственный участник)
}

message TransferAdminRequest {
 string trip_id = 1;
 string new_admin_user_id = 2;
}
message TransferAdminResponse {
 bool success = 1;
}

// настройки уведомлений по трипу (ТЗ 12.4.1)
message UpdateTripSettingsRequest {
 string trip_id = 1;
 bool notifications_enabled = 2;
}
message UpdateTripSettingsResponse {
 bool success = 1;
}

// лента опубликованных трипов (ТЗ 7.9-7.10).
// Фильтры city/country принимают точные имена в lower-case (английские);
// сервер резолвит их в geo_registry.
// Если регион не найден — лента возвращает пустой результат без ошибки.
message ListFeedRequest {
 int32 limit = 1;
 int32 offset = 2;
 string category = 3; // ТЗ 7.9.1
 string season = 4; // ТЗ 7.9.2
 string city = 7; // ТЗ 7.9.3 — точное имя города в lower-case
 string country = 8; // ТЗ 7.9.3 — точное имя страны в lower-case
 string sort_by = 6; // "date" (ТЗ 7.10.1) или "rating" (ТЗ 7.10.2)
 reserved 5;
 reserved "location_ids";
}

// lightweight media for feed card carousel (up to 8, sorted by battle_rating).
message FeedMedia {
 string media_id = 1;
 string url = 2; // presigned GET URL
 string media_type = 3; // image, video
}

// lightweight pin for feed card map.
message FeedPin {
 string id = 1;
 double latitude = 2;
 double longitude = 3;
 repeated FeedMedia media = 4; // up to 10, sorted by battle_rating
}

// a single feed card with trip, pins and media.
// is_liked / is_disliked / is_saved — per-user view-state for caller (ТЗ 7.5, 7.6).
message FeedItem {
 Trip trip = 1;
 repeated FeedPin pins = 2;
 repeated FeedMedia media = 3;
 bool is_liked = 4;
 bool is_disliked = 5;
 bool is_saved = 6;
}

message ListFeedResponse {
 repeated FeedItem items = 1;
}

message LikeTripRequest {
 string trip_id = 1;
}
message LikeTripResponse {
 bool success = 1;
}

message DislikeTripRequest {
 string trip_id = 1;
}
message DislikeTripResponse {
 bool success = 1;
}

message AddToFavouritesRequest {
 string trip_id = 1;
}
message AddToFavouritesResponse {
 bool success = 1;
}

message RemoveFromFavouritesRequest {
 string trip_id = 1;
}
message RemoveFromFavouritesResponse {
 bool success = 1;
}

message ListFavouritesRequest {
 int32 limit = 1;
 int32 offset = 2;
}
message ListFavouritesResponse {
 repeated Trip trips = 1;
}

// старт сессии добавления медиа в READY-трип (ТЗ 5.3 → 3.8).
// идемпотентна на race — если сессия уже активна, возвращает её с joined=true.
message AddMediaStartRequest {
 string trip_id = 1;
 repeated FileToUpload files_to_upload = 2;
}
message AddMediaStartResponse {
 string session_id = 1;
 string status = 2;
 repeated UploadUrl upload_urls = 3;
 // true, если подключились к уже существующей сессии (race).
 // В этом случае upload_urls пустой — использовать AddMediaRequestUploadUrls.
 bool joined = 4;
}

// выдача presigned URLs для догрузки файлов в активную сессию.
// Сессия должна быть в ADD_MEDIA_UPLOADING, session_id — валидный.
message AddMediaRequestUploadUrlsRequest {
 string trip_id = 1;
 string session_id = 2;
 repeated FileToUpload files_to_upload = 3;
}
message AddMediaRequestUploadUrlsResponse {
 repeated UploadUrl upload_urls = 1;
}

// регистрация факта загрузки файла в S3. Клиент зовёт после каждого PUT.
// Сервер создаёт media entry без pin_id, привязывает к сессии, публикует WS ADD_MEDIA_PROGRESS.
message AddMediaCommitUploadRequest {
 string trip_id = 1;
 string session_id = 2;
 string s3_key = 3;
 string media_type = 4; // image | video
 optional int64 captured_at_unix = 5;
 optional double latitude = 6;
 optional double longitude = 7;
}
message AddMediaCommitUploadResponse {
 string media_id = 1;
 int32 media_count_in_session = 2;
 int32 remaining_slots = 3;
}

// снимок медиа сессии для экрана UPLOADING.
// Возвращает и свои, и чужие медиа в сессии (с presigned GET URL).
message AddMediaGetSessionMediaRequest {
 string trip_id = 1;
 string session_id = 2;
}
message AddMediaGetSessionMediaResponse {
 string session_id = 1;
 repeated SessionMedia media = 2;
 int32 media_count_in_session = 3;
}
message SessionMedia {
 string media_id = 1;
 string url = 2; // presigned GET
 string type = 3; // image | video
 string actor_user_id = 4; // кто загрузил
 int64 uploaded_at_unix = 5;
}

// → переход в группировку. media[] убран — сервер берёт из БД.
// Флаг add_more откатывает обратно в ADD_MEDIA_UPLOADING для докидывания файлов.
message AddMediaProcessGroupingRequest {
 string trip_id = 1;
 string session_id = 2;
 reserved 3; // было: repeated MediaMeta media
 bool add_more = 4;
}
message AddMediaProcessGroupingResponse {
 string trip_id = 1;
 string session_id = 2;
 string status = 3;
 repeated DraftPin draft_pins = 4;
 repeated string existing_media_ids = 5;
}

// снимок draft_pins для экрана GROUPING_REVIEW.
// Вычисляется детерминированно (та же функция, что в ProcessGrouping), без изменения статуса.
message AddMediaGetGroupingRequest {
 string trip_id = 1;
 string session_id = 2;
}
message AddMediaGetGroupingResponse {
 string trip_id = 1;
 string session_id = 2;
 repeated DraftPin draft_pins = 3;
 repeated string existing_media_ids = 4;
}

// применение групп и запуск ML (ТЗ 5.3.3-5.3.4).
// вызвавший становится ведущим финального ревью.
message AddMediaApplyGroupsAndProcessRequest {
 string trip_id = 1;
 string session_id = 2;
 repeated DraftPinInput draft_pins = 3;
 repeated string deleted_media_ids = 4;
}
message AddMediaApplyGroupsAndProcessResponse {
 string message = 1;
 string status = 2;
}

// финальное ревью add-media. Read-only для не-ведущего.
message AddMediaGetReviewRequest {
 string trip_id = 1;
 string session_id = 2;
}
message AddMediaGetReviewResponse {
 string trip_id = 1;
 string session_id = 2;
 repeated TripPin pins = 3;
 repeated string new_pin_ids = 4; // пины, созданные в этой сессии
 repeated string protected_media_ids = 5; // медиа из старых пинов, нельзя трогать
 optional string current_initiator_user_id = 6;
 optional int64 takeover_available_at_unix = 7;
 bool can_edit = 8; // рассчитано сервером для удобства клиента
}

// подтверждение финального ревью — закрывает сессию, трип → READY.
// Только ведущий. Идемпотентна: повторный вызов уже закрытой сессии = already_confirmed.
//
// Правки пинов и удаление «похожих» медиа (ТЗ 3.14/3.15) передаются батчем прямо в
// Confirm — аналогично FinalizeTrip в creation-флоу. Это атомарная операция:
// применить правки → закрыть сессию → трип в READY. Если pin_updates/media_to_delete
// пусты — Confirm работает как простое подтверждение без правок.
message AddMediaConfirmRequest {
 string trip_id = 1;
 string session_id = 2;
 repeated PinUpdate pin_updates = 3;
 repeated string media_to_delete = 4;
}
message AddMediaConfirmResponse {
 string status = 1;
 bool already_confirmed = 2;
}

// отмена add-media сессии. Удаляет все медиа без pin_id, трип → READY.
// На DRAFT_FINAL_REVIEW доступна только ведущему, на остальных этапах — любому participant.
message AddMediaCancelRequest {
 string trip_id = 1;
 string session_id = 2;
}
message AddMediaCancelResponse {
 string status = 1;
}

// AddMediaTakeover — explicit передача роли ведущего после истечения часа
// бездействия предыдущего ведущего. Идемпотентна: если caller уже ведущий,
// сервер возвращает 200 без mutation и без обновления таймера.
message AddMediaTakeoverRequest {
 string trip_id = 1;
 string session_id = 2;
}
message AddMediaTakeoverResponse {
 string current_initiator_user_id = 1;
 int64 takeover_available_at_unix = 2;
 bool is_initiator = 3;
}

// лёгкая сводка по всем трипам пользователя — для статистики профиля.
// Не пагинируется, возвращает все трипы, где user — участник.
message TripSummary {
 string trip_id = 1;
 int32 pins_count = 2;
 int32 media_count = 3;
}
message ListUserTripSummariesRequest {
 string user_id = 1;
}
message ListUserTripSummariesResponse {
 repeated TripSummary trips = 1;
}

// фотобатлы (ТЗ 8.1)
message StartBattleRequest {
 string trip_id = 1;
}
message BattleMedia {
 string media_id = 1;
 string url = 2;
 string media_type = 3;
}
message StartBattleResponse {
 string battle_id = 1;
 repeated BattleMedia media = 2; // ровно 8 медиа, случайная выборка из трипа
}

message SubmitBattleResultRequest {
 string battle_id = 1;
 string winner_media_id = 2;
}
message SubmitBattleResultResponse {
 int32 new_battle_rating = 1;
}

// лучшие воспоминания, story-mode (ТЗ 8.2)
message GetBestMemoriesRequest {
 string trip_id = 1;
}
message BestMemory {
 string media_id = 1;
 string url = 2;
 string media_type = 3;
 int32 battle_rating = 4;
 int64 captured_at_unix = 5;
 string pin_name = 6;
}
message GetBestMemoriesResponse {
 repeated BestMemory media = 1;
}

// выбранные настройки уведомлений по списку участников трипа.
// Возвращает map user_id -> notifications_enabled. Если записи в trip_settings
// нет, значение считается true (см. EnsureDefaultSettings).
message GetNotificationSettingsRequest {
 string trip_id = 1;
 repeated string user_ids = 2;
}
message GetNotificationSettingsResponse {
 map<string, bool> notifications_enabled = 1;
}

// трип + участники для рассылки таймерных пушей.
// years_elapsed — для anniversary-события (ТЗ 11.3.1): «N лет назад»;
// для end_date-события не заполняется (0).
message NotificationTrip {
 string trip_id = 1;
 string name = 2;
 repeated string participant_user_ids = 3;
 int64 start_date_unix = 4;
 int64 end_date_unix = 5;
 int32 years_elapsed = 6;
}

// трипы, отмечающие годовщину (created_at == today - 1 year).
message ListAnniversaryTripsRequest {
 int64 today_unix = 1;
}
message ListAnniversaryTripsResponse {
 repeated NotificationTrip trips = 1;
}

// трипы, у которых end_date пришёлся на сегодня минус 1 месяц.
message ListEndedMonthAgoTripsRequest {
 int64 today_unix = 1;
}
message ListEndedMonthAgoTripsResponse {
 repeated NotificationTrip trips = 1;
}

// список user_id участников трипа (для notification-service
// адресации пушей всем участникам по событию).
message ListTripParticipantsRequest {
 string trip_id = 1;
}
message ListTripParticipantsResponse {
 repeated string user_ids = 1;
}

// поиск пинов по name/description/tags в трипах пользователя.
// user_id берётся из gRPC metadata (x-user-id), не передаётся в request.
message SearchPinsRequest {
 string query = 1;
 int32 limit = 2;
 int32 offset = 3;
}
message SearchPinsResponse {
 repeated TripPin pins = 1;
}

// Per-user приватность: каждый участник выставляет свой уровень для trip/pin/media.
// privacy_level — выбор пользователя (public|private). user_id берётся из gRPC metadata.
message UpsertTripPrivacyRequest {
 string trip_id = 1;
 string privacy_level = 2;
}
message UpsertPinPrivacyRequest {
 string trip_id = 1;
 string pin_id = 2;
 string privacy_level = 3;
}
message UpsertMediaPrivacyRequest {
 string trip_id = 1;
 string media_id = 2;
 string privacy_level = 3;
}
// effective_privacy_level — агрегированный уровень сущности после пересчёта.
message UpsertPrivacyResponse {
 string effective_privacy_level = 1;
}

// Pin RUD (ТЗ 4.2-4.5)
message GetPinRequest {
 string trip_id = 1;
 string pin_id = 2;
}
message GetPinResponse {
 TripPin pin = 1;
}

// UpdatePin: PATCH-семантика, optional поля. tags применяется при tags_set=true
// (replace-all, в т.ч. пустым массивом). privacy_level — отдельная ручка UpsertPinPrivacy.
message UpdatePinRequest {
 string trip_id = 1;
 string pin_id = 2;
 optional string name = 3;          // ≤100
 optional string description = 4;   // ≤5000
 optional string category = 5;      // pinCategories; иначе → "Другое"
 optional double latitude = 6;
 optional double longitude = 7;
 optional int64  start_time_unix = 8;
 optional int64  end_time_unix = 9;
 repeated string tags = 10;
 bool tags_set = 11;
}
message UpdatePinResponse {
 TripPin pin = 1;
}

message DeletePinRequest {
 string trip_id = 1;
 string pin_id = 2;
}
// deletion_mode: "full" — пин и все медиа удалены полностью (ТЗ 4.5.1);
// "soft_for_user" — пин скрыт только для caller'а через pin_hidden_by_user (ТЗ 4.5.2,
// когда трип в избранном у других пользователей).
message DeletePinResponse {
 string deletion_mode = 1;
}

message RemoveMediaFromPinRequest {
 string trip_id = 1;
 string pin_id = 2;
 string media_id = 3;
}
message RemoveMediaFromPinResponse {
 TripPin pin = 1;
}

// =============================================================================
// Pin upload (унифицированная сессия загрузки медиа)
// =============================================================================

message PinUploadStartRequest {
 string trip_id = 1;
 // target_pin_id nil → создание нового пина; заполнен → добавление медиа в существующий.
 optional string target_pin_id = 2;
 repeated FileToUpload files_to_upload = 3;
}
message PinUploadStartResponse {
 string session_id = 1;
 repeated UploadUrl upload_urls = 2;
}

message RequestPinUploadUrlsRequest {
 string trip_id = 1;
 string session_id = 2;
 repeated FileToUpload files_to_upload = 3;
}
message RequestPinUploadUrlsResponse {
 repeated UploadUrl upload_urls = 1;
}

message CommitPinUploadRequest {
 string trip_id = 1;
 string session_id = 2;
 string s3_key = 3;
 string media_type = 4; // image | video
 optional int64 captured_at_unix = 5;
 optional double latitude = 6;
 optional double longitude = 7;
}
message CommitPinUploadResponse {
 string media_id = 1;
 int32 media_count_in_session = 2;
}

message ProcessPinUploadRequest {
 string trip_id = 1;
 string session_id = 2;
}
message ProcessPinUploadResponse {
 string session_id = 1;
 string processing_status = 2; // UPLOADING | PROCESSING | READY_FOR_REVIEW
}

// PinUploadDraft — snapshot после worker-обработки. Suggested заполнено только
// для creation (target_pin_id == nil).
message PinUploadDraft {
 optional PinSuggestedFields suggested = 1;
 repeated ReviewPinMedia media = 2;
 repeated string pin_issues = 3;
 repeated string nsfw_media_ids = 4;
 repeated string deduped_media_ids = 5;
}
message PinSuggestedFields {
 string name = 1;
 string category = 2;
 repeated string tags = 3;
 optional double latitude = 4;
 optional double longitude = 5;
 optional int64 start_time_unix = 6;
 optional int64 end_time_unix = 7;
}

message GetPinUploadReviewRequest {
 string trip_id = 1;
 string session_id = 2;
}
message GetPinUploadReviewResponse {
 string session_id = 1;
 PinUploadDraft draft = 2; // пусто на UPLOADING/PROCESSING
 repeated MediaSimilarGroup similar = 3;
 string processing_status = 4;
}

message FinalizePinUploadRequest {
 string trip_id = 1;
 string session_id = 2;
 // Поля заполняются только для creation; для addition игнорируются.
 optional string name = 3;
 optional string description = 4;
 optional string category = 5;
 optional double latitude = 6;
 optional double longitude = 7;
 optional int64 start_time_unix = 8;
 optional int64 end_time_unix = 9;
 repeated string tags = 10;
 bool tags_set = 11;
 // media_to_delete — id медиа из сессии, которые клиент пометил на удаление.
 repeated string media_to_delete = 12;
}
message FinalizePinUploadResponse {
 TripPin pin = 1;
}

message CancelPinUploadRequest {
 string trip_id = 1;
 string session_id = 2;
}
message CancelPinUploadResponse {
 string status = 1;
}

// Рекомендации (ТЗ 9): запрос принимает либо city, либо country (XOR).
// Радиус кластеризации выбирается на сервере: 50 м для города, 500 м для страны.
message GetRecommendationsRequest {
 string city = 1;
 string country = 2;
 string category = 3; // ТЗ 9.2.2 → 7.9.1
 string season = 4;   // ТЗ 9.2.2 → 7.9.2
}

// RecommendedPin — пин-кандидат из топ-трипов региона. ID и trip_id указывают
// на исходный пин/трип (для возможной навигации клиента); при сохранении
// рекомендации (SaveRecommendation) пины копируются в новый generated-трип.
message RecommendedPin {
 string id = 1;
 string trip_id = 2;
 double latitude = 3;
 double longitude = 4;
 string name = 5;
 string description = 6;
 string category = 7;
 string location_name = 8;
 int32 media_count = 9;
 repeated FeedMedia media = 10;
}

message RecommendedMap {
 string region_name = 1; // имя региона в lower-case
 string region_type = 2; // "city" | "country"
 repeated RecommendedPin pins = 3;
 // Виртуальный трип-обёртка с заполненными name/description/cover/счётчиками,
 // чтобы карта могла встраиваться в общую ленту как обычный FeedItem.
 // trip.id пустой до вызова SaveRecommendation.
 Trip trip = 4;
 // Топ-8 медиа из всех выбранных пинов (для карусели в карточке ленты),
 // отсортированы по battle_rating DESC.
 repeated FeedMedia media = 5;
 string snapshot_token = 6;
}

message GetRecommendationsResponse {
 RecommendedMap map = 1;
}

message SaveRecommendationRequest {
 string city = 1;
 string country = 2;
 string snapshot_token = 3;
 repeated string pin_ids = 4;
 string category = 5;
 string season = 6;
}

message SaveRecommendationResponse {
 Trip trip = 1;
}
