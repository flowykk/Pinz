syntax = "proto3";

package trip;

option go_package = "pinz/backend/trip-service/pkg/proto";

service TripService {
  rpc CreateTrip(CreateTripRequest) returns (CreateTripResponse);
  rpc GetTrip(GetTripRequest) returns (GetTripResponse);
  rpc ListUserTrips(ListUserTripsRequest) returns (ListUserTripsResponse);
  rpc UpdateTrip(UpdateTripRequest) returns (UpdateTripResponse);
  rpc DeleteTrip(DeleteTripRequest) returns (DeleteTripResponse);
  rpc GenerateInviteLink(GenerateInviteLinkRequest) returns (GenerateInviteLinkResponse);
  rpc JoinTripByToken(JoinTripByTokenRequest) returns (JoinTripByTokenResponse);
  rpc RemoveParticipant(RemoveParticipantRequest) returns (RemoveParticipantResponse);
  rpc LeaveTrip(LeaveTripRequest) returns (LeaveTripResponse);
  rpc TransferAdmin(TransferAdminRequest) returns (TransferAdminResponse);
  rpc ProcessMediaGrouping(ProcessMediaGroupingRequest) returns (ProcessMediaGroupingResponse);
  rpc ApplyGroupsAndProcess(ApplyGroupsAndProcessRequest) returns (ApplyGroupsAndProcessResponse);
  rpc GetTripReview(GetTripReviewRequest) returns (GetTripReviewResponse);
  rpc FinalizeTrip(FinalizeTripRequest) returns (FinalizeTripResponse);
  rpc AddMediaStart(AddMediaStartRequest) returns (AddMediaStartResponse);
  rpc AddMediaProcessGrouping(AddMediaProcessGroupingRequest) returns (AddMediaProcessGroupingResponse);
  rpc AddMediaApplyGroupsAndProcess(AddMediaApplyGroupsAndProcessRequest) returns (AddMediaApplyGroupsAndProcessResponse);
  rpc PublishTrip(PublishTripRequest) returns (PublishTripResponse);
  rpc UpdateTripSettings(UpdateTripSettingsRequest) returns (UpdateTripSettingsResponse);
  rpc ListFeed(ListFeedRequest) returns (ListFeedResponse);
  rpc LikeTrip(LikeTripRequest) returns (LikeTripResponse);
  rpc DislikeTrip(DislikeTripRequest) returns (DislikeTripResponse);
  rpc AddToFavourites(AddToFavouritesRequest) returns (AddToFavouritesResponse);
  rpc RemoveFromFavourites(RemoveFromFavouritesRequest) returns (RemoveFromFavouritesResponse);
  rpc UpdateTripPrivacy(UpdateTripPrivacyRequest) returns (UpdateTripPrivacyResponse);
  rpc UpdatePinPrivacy(UpdatePinPrivacyRequest) returns (UpdatePinPrivacyResponse);
  rpc UpdateMediaPrivacy(UpdateMediaPrivacyRequest) returns (UpdateMediaPrivacyResponse);
  rpc SearchPins(SearchPinsRequest) returns (SearchPinsResponse);
  rpc CreatePin(CreatePinRequest) returns (CreatePinResponse);
  rpc UpdatePin(UpdatePinRequest) returns (UpdatePinResponse);
  rpc DeletePin(DeletePinRequest) returns (DeletePinResponse);
  rpc AddPinTags(AddPinTagsRequest) returns (AddPinTagsResponse);
  rpc RemovePinTags(RemovePinTagsRequest) returns (RemovePinTagsResponse);
}

message Trip {
  string id = 1;
  string owner_user_id = 2;
  string name = 3;
  string description = 4;
  string category = 5;
  string season = 6;
  string status = 7;
  string privacy_level = 8;
  int64 start_date_unix = 9;
  int64 end_date_unix = 10;
  int32 likes_count = 11;
  int32 dislikes_count = 12;
  string cover_url = 13;
  bool is_published = 14;
  bool is_generated = 15;
  int64 created_at_unix = 16;
  int64 updated_at_unix = 17;
}

message CreateTripRequest {
  string owner_user_id = 1;
  string name = 2;
  string description = 3;
  string category = 4;
  string season = 5;
  repeated FileToUpload files_to_upload = 7;
}

message FileToUpload {
  string client_id = 1;
  string content_type = 2;
}

message CreateTripResponse {
  string trip_id = 1;
  string status = 2;
  repeated UploadUrl upload_urls = 3;
}

message UploadUrl {
  string client_id = 1;
  string s3_key = 2;
  string url = 3;
}

message GetTripRequest {
  string trip_id = 1;
  string user_id = 2;
}

message TripParticipantRef {
  string user_id = 1;
  bool is_admin = 2;
}

message GetTripResponse {
  Trip trip = 1;
  repeated TripDetailPin pins = 2;
  repeated TripParticipantRef participants = 3;
}
message TripDetailPin {
  string id = 1;
  string name = 2;
  string description = 3;
  string category = 4;
  string privacy_level = 5;
  optional double latitude = 6;
  optional double longitude = 7;
  int64 start_time_unix = 8;
  int64 end_time_unix = 9;
  repeated TripDetailMedia media = 10;
}
message TripDetailMedia {
  string id = 1;
  string s3_key = 2;
  string media_type = 3;
  string privacy_level = 4;
}

message ListUserTripsRequest {
  string user_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListUserTripsResponse {
  repeated Trip trips = 1;
}

message UpdateTripRequest {
  string trip_id = 1;
  string user_id = 2;
  optional string name = 3;
  optional string description = 4;
  optional string category = 5;
  optional string season = 6;
  optional string privacy_level = 7;
  optional int64 start_date_unix = 8;
  optional int64 end_date_unix = 9;
  optional string cover_url = 10;
}

message UpdateTripResponse {
  Trip trip = 1;
}

message DeleteTripRequest {
  string trip_id = 1;
  string user_id = 2;
}

message DeleteTripResponse {
  bool success = 1;
}

message PublishTripRequest {
  string trip_id = 1;
  bool publish_whole = 2;
  repeated string pin_ids = 3;
}

message PublishTripResponse {
  Trip trip = 1;
}

message ProcessMediaGroupingRequest {
  string trip_id = 1;
  repeated MediaMeta media = 2;
}
message MediaMeta {
  string s3_key = 1;
  string media_type = 2;  // image, video
  int64 captured_at_unix = 3;
  optional double latitude = 4;
  optional double longitude = 5;
  optional string content_hash = 6;
}
message ProcessMediaGroupingResponse {
  string trip_id = 1;
  string status = 2;
  repeated DraftPin draft_pins = 3;
}
message DraftPin {
  string draft_pin_id = 1;
  repeated DraftPinMedia media = 2;
}
message DraftPinMedia {
  string media_id = 1;
  string url = 2;   // read URL (from Media Service or placeholder)
  string type = 3;  // image, video
}

message GroupedPin {
  string pin_id = 1;
  bool read_only = 2;
  repeated GroupedMedia media = 3;
}
message GroupedMedia {
  string media_id = 1;
  bool read_only = 2;
  string url = 3;
  string type = 4; // image, video
}

message AddMediaStartRequest {
  string trip_id = 1;
  repeated FileToUpload files_to_upload = 2;
}
message AddMediaStartResponse {
  string trip_id = 1;
  string session_id = 2;
  repeated UploadUrl upload_urls = 3;
}

message AddMediaProcessGroupingRequest {
  string trip_id = 1;
  string session_id = 2;
  repeated MediaMeta media = 3;
}
message AddMediaProcessGroupingResponse {
  string trip_id = 1;
  string session_id = 2;
  repeated GroupedPin pins = 3;
}

message AddMediaApplyGroupsAndProcessRequest {
  string trip_id = 1;
  string session_id = 2;
  repeated DraftPinInput draft_pins = 3;
  repeated string deleted_media_ids = 4;
}
message AddMediaApplyGroupsAndProcessResponse {
  string message = 1;
  string status = 2;
}

message ApplyGroupsAndProcessRequest {
  string trip_id = 1;
  repeated DraftPinInput draft_pins = 2;
  repeated string deleted_media_ids = 3;
}
message DraftPinInput {
  string draft_pin_id = 1;
  repeated string media_ids = 2;
}
message ApplyGroupsAndProcessResponse {
  string message = 1;
  string status = 2;
}

message GetTripReviewRequest {
  string trip_id = 1;
}
message GetTripReviewResponse {
  string trip_id = 1;
  string status = 2;
  repeated MediaSimilarGroup similar = 3;
  repeated ReviewPin pins = 4;
}
message MediaSimilarGroup {
  repeated string media_ids = 1;
}
message ReviewPin {
  string pin_id = 1;
  string name = 2;
  string category = 3;
  optional double latitude = 4;
  optional double longitude = 5;
  string location_name = 6;
  int64 start_time_unix = 7;
  int64 end_time_unix = 8;
  repeated string issues = 9;   // MISSING_COORDINATES, MISSING_DATES
  repeated string tags = 10;
  repeated ReviewPinMedia media = 11;
}
message ReviewPinMedia {
  string media_id = 1;
  string url = 2;
  string privacy_level = 4;
}

message FinalizeTripRequest {
  string trip_id = 1;
  repeated PinUpdate pin_updates = 2;
  repeated string media_to_delete = 3;
}
message PinUpdate {
  string pin_id = 1;
  optional string name = 2;
  optional double latitude = 3;
  optional double longitude = 4;
  optional string description = 5;
  optional string category = 6;
  optional string privacy_level = 7;
  repeated string tags = 8;
}
message FinalizeTripResponse {
  string trip_id = 1;
  string status = 2;
  string message = 3;
}

message GenerateInviteLinkRequest {
  string trip_id = 1;
  int64 expires_in_seconds = 2;  // TTL ссылки, например 86400 = 24 часа
}
message GenerateInviteLinkResponse {
  string invite_link_id = 1;
  string token = 2;
  string invite_url = 3;   // полный URL для шаринга (клиент или gateway может собрать)
  int64 expires_at_unix = 4;
}

message JoinTripByTokenRequest {
  string token = 1;
}
message JoinTripByTokenResponse {
  string trip_id = 1;
  bool already_joined = 2;
}

message RemoveParticipantRequest {
  string trip_id = 1;
  string user_id = 2;  // участник, которого удаляем
}
message RemoveParticipantResponse {
  bool success = 1;
}

message LeaveTripRequest {
  string trip_id = 1;
}
message LeaveTripResponse {
  bool success = 1;
  bool trip_deleted = 2;  // true если трип удалён (был единственный участник)
}

message TransferAdminRequest {
  string trip_id = 1;
  string new_admin_user_id = 2;
}
message TransferAdminResponse {
  bool success = 1;
}

message UpdateTripSettingsRequest {
  string trip_id = 1;
  bool notifications_enabled = 2;
}
message UpdateTripSettingsResponse {
  bool success = 1;
}

message ListFeedRequest {
  int32 limit = 1;
  int32 offset = 2;
  string category = 3;
  string season = 4;
  int32 location_id = 5;
  string location_name = 7;  // filter by country or city name (resolved via geo_registry)
  string sort_by = 6;
}
message FeedCardPin {
  string id = 1;
  double latitude = 2;
  double longitude = 3;
}
message FeedCardMedia {
  string id = 1;
  string s3_key = 2;
  string media_type = 3;
}
message FeedCard {
  Trip trip = 1;
  repeated FeedCardPin pins = 2;
  repeated FeedCardMedia media = 3;
}
message ListFeedResponse {
  repeated Trip trips = 1;
  repeated FeedCard cards = 2;
}

message LikeTripRequest {
  string trip_id = 1;
}
message LikeTripResponse {
  bool success = 1;
}

message DislikeTripRequest {
  string trip_id = 1;
}
message DislikeTripResponse {
  bool success = 1;
}

message AddToFavouritesRequest {
  string trip_id = 1;
}
message AddToFavouritesResponse {
  bool success = 1;
}

message RemoveFromFavouritesRequest {
  string trip_id = 1;
}
message RemoveFromFavouritesResponse {
  bool success = 1;
}

message UpdateTripPrivacyRequest {
  string trip_id = 1;
  string privacy_level = 2;  // Public or Private only (Restricted forbidden)
}
message UpdateTripPrivacyResponse {
  bool success = 1;
}

message UpdatePinPrivacyRequest {
  string pin_id = 1;
  string privacy_level = 2;
}
message UpdatePinPrivacyResponse {
  bool success = 1;
}

message UpdateMediaPrivacyRequest {
  string media_id = 1;
  string privacy_level = 2;
}
message UpdateMediaPrivacyResponse {
  bool success = 1;
}

message SearchPinsRequest {
  string query = 1;
  int32 limit = 2;
  int32 offset = 3;
}
message SearchPinsResponse {
  repeated SearchPinItem pins = 1;
}
message SearchPinItem {
  string pin_id = 1;
  string trip_id = 2;
  string name = 3;
  string description = 4;
  string category = 5;
  repeated string tags = 6;
}

message CreatePinRequest {
  string trip_id = 1;
  repeated string media_ids = 2;
}
message CreatePinResponse {
  string pin_id = 1;
}

message UpdatePinRequest {
  string pin_id = 1;
  optional string name = 2;
  optional string description = 3;
  optional string category = 4;
  optional string privacy_level = 5;
  optional double latitude = 6;
  optional double longitude = 7;
  optional int64 start_time_unix = 8;
  optional int64 end_time_unix = 9;
}
message UpdatePinResponse {
  bool success = 1;
}

message DeletePinRequest {
  string pin_id = 1;
}
message DeletePinResponse {
  bool success = 1;
}

message AddPinTagsRequest {
  string pin_id = 1;
  repeated string tags = 2;
}
message AddPinTagsResponse {
  bool success = 1;
}

message RemovePinTagsRequest {
  string pin_id = 1;
  repeated string tags = 2;
}
message RemovePinTagsResponse {
  bool success = 1;
}
