apiVersion: apps/v1
kind: Deployment
metadata:
  name: trip-service
  labels:
    app: trip-service
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: trip-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      labels:
        app: trip-service
    spec:
      serviceAccountName: trip-service-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: trip-service
                topologyKey: kubernetes.io/hostname
      containers:
        - name: trip-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: {{ .Values.service.port }}
              name: grpc
          env:
            - name: USER
              value: "app"
            - name: GRPC_PORT
              value: {{ .Values.env.grpcPort | quote }}
            - name: DB_HOST
              value: {{ .Values.env.dbHost | quote }}
            - name: DB_PORT
              value: {{ .Values.env.dbPort | quote }}
            - name: DB_USER
              value: {{ .Values.env.dbUser | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trip-service-secret
                  key: db-password
            - name: DB_NAME
              value: {{ .Values.env.dbName | quote }}
            - name: REDIS_ADDR
              value: {{ .Values.env.redisAddr | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.env.otelExporterEndpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.env.otelServiceName | quote }}
            - name: OTEL_TRACES_SAMPLER
              value: {{ .Values.env.otelTracesSampler | quote }}
            - name: OTEL_TRACES_SAMPLER_ARG
              value: {{ .Values.env.otelTracesSamplerArg | quote }}
            - name: S3_ENDPOINT
              value: {{ .Values.env.s3Endpoint | quote }}
            - name: S3_REGION
              value: {{ .Values.env.s3Region | quote }}
            - name: S3_BUCKET
              value: {{ .Values.env.s3Bucket | quote }}
            - name: S3_PRESIGN_TTL
              value: {{ .Values.env.s3PresignTTL | quote }}
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: trip-service-secret
                  key: s3-access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: trip-service-secret
                  key: s3-secret-key
            - name: S3_KEY_PREFIX
              value: {{ .Values.env.s3KeyPrefix | quote }}
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu | quote }}
              memory: {{ .Values.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.resources.limits.cpu | quote }}
              memory: {{ .Values.resources.limits.memory | quote }}
          readinessProbe:
            grpc:
              port: {{ .Values.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            grpc:
              port: {{ .Values.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
