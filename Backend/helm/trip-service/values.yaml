replicaCount: 1

image:
  repository: ghcr.io/dmitry-pr/pinz-trip-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  name: grpc
  port: 50052

env:
  dbHost: db-trips
  dbPort: "5433"
  dbUser: pinz_user
  dbName: pinz_trips
  redisAddr: redis:6379
  grpcPort: ":50052"
  otelExporterEndpoint: "otel-collector.default.svc.cluster.local:4317"
  otelServiceName: "trip-service"
  otelTracesSampler: "parentbased_traceid_ratio"
  otelTracesSamplerArg: "1.0"

secret:
  dbPassword: "REPLACE_IN_PRODUCTION"

resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "200m"
    memory: "128Mi"

pdb:
  enabled: false
  minAvailable: 1

dockerConfig:
  auths:
    ghcr.io:
      username: "{{ .Values.github.actor }}"
      password: "{{ .Values.github.token }}"
