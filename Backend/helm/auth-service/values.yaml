replicaCount: 1

image:
  repository: ghcr.io/dmitry-pr/pinz-auth-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  name: grpc
  port: 50051

env:
  dbHost: db
  dbPort: "5432"
  dbUser: pinz_user
  dbName: pinz_db
  redisAddr: redis:6379
  grpcPort: ":50051"
  otelExporterEndpoint: "otel-collector.default.svc.cluster.local:4317"
  otelServiceName: "auth-service"
  otelTracesSampler: "parentbased_traceidratio"
  otelTracesSamplerArg: "1.0"
  s3Endpoint: "https://storage.yandexcloud.net"
  s3Region: "ru-central1"
  s3Bucket: ""
  s3PresignTTL: "15m"
  # On loadtest stand: "loadtest/".
  s3KeyPrefix: ""
  # Only on loadtest stand. Never set to "true" on prod.
  authDevLoginEnabled: "false"

secret:
  dbPassword: "REPLACE_IN_PRODUCTION"
  jwtSecretKey: "REPLACE_IN_PRODUCTION"
  s3AccessKey: ""
  s3SecretKey: ""

resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "200m"
    memory: "128Mi"

pdb:
  enabled: false
  minAvailable: 1

dockerConfig:
  auths:
    ghcr.io:
      username: "{{ .Values.github.actor }}"
      password: "{{ .Values.github.token }}"
