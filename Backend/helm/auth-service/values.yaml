replicaCount: 1

image:
  repository: ghcr.io/dmitry-pr/pinz-auth-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  name: grpc
  port: 50051

env:
  dbHost: db
  dbPort: "5432"
  dbUser: pinz_user
  dbName: pinz_db
  redisAddr: redis:6379
  grpcPort: ":50051"

secret:
  dbPassword: "pinz_password"
  jwtSecretKey: "change-me-in-production"

dockerConfig:
  auths:
    ghcr.io:
      username: "{{ .Values.github.actor }}"
      password: "{{ .Values.github.token }}"
