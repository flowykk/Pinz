apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  labels:
    app: notification-service
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: notification-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      serviceAccountName: notification-service-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: notification-service
                topologyKey: kubernetes.io/hostname
      containers:
        - name: notification-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: {{ .Values.service.port }}
              name: grpc
          env:
            - name: USER
              value: "app"
            - name: GRPC_PORT
              value: {{ .Values.env.grpcPort | quote }}
            - name: DB_HOST
              value: {{ .Values.env.dbHost | quote }}
            - name: DB_PORT
              value: {{ .Values.env.dbPort | quote }}
            - name: DB_USER
              value: {{ .Values.env.dbUser | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notification-service-secret
                  key: db-password
            - name: DB_NAME
              value: {{ .Values.env.dbName | quote }}
            - name: REDIS_ADDR
              value: {{ .Values.env.redisAddr | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.env.otelExporterEndpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.env.otelServiceName | quote }}
            - name: OTEL_TRACES_SAMPLER
              value: {{ .Values.env.otelTracesSampler | quote }}
            - name: OTEL_TRACES_SAMPLER_ARG
              value: {{ .Values.env.otelTracesSamplerArg | quote }}
            - name: TRIP_SERVICE_GRPC_ADDRESS
              value: {{ .Values.env.tripServiceGrpcAddress | quote }}
            - name: APNS_KEY_ID
              value: {{ .Values.env.apnsKeyId | quote }}
            - name: APNS_TEAM_ID
              value: {{ .Values.env.apnsTeamId | quote }}
            - name: APNS_BUNDLE_ID
              value: {{ .Values.env.apnsBundleId | quote }}
            - name: APNS_PRODUCTION
              value: {{ .Values.env.apnsProduction | quote }}
            - name: APNS_KEY_BASE64
              valueFrom:
                secretKeyRef:
                  name: notification-service-secret
                  key: apns-key-base64
            - name: SMTP_HOST
              value: {{ .Values.env.smtpHost | quote }}
            - name: SMTP_PORT
              value: {{ .Values.env.smtpPort | quote }}
            - name: SMTP_FROM
              value: {{ .Values.env.smtpFrom | quote }}
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: notification-service-secret
                  key: smtp-username
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notification-service-secret
                  key: smtp-password
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu | quote }}
              memory: {{ .Values.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.resources.limits.cpu | quote }}
              memory: {{ .Values.resources.limits.memory | quote }}
          readinessProbe:
            grpc:
              port: {{ .Values.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            grpc:
              port: {{ .Values.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
